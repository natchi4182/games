<script type="module">

document.getElementById('load').remove();
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);

// ------------------------------------------------------------ 音
let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); }

// ------------------------------------------------------------ レンダラー
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0c20, .018);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, .1, 400);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .75, .55, .82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

let portrait = false;
function onResize() { renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  portrait = innerHeight > innerWidth; const r = document.getElementById('rot'); if (r) r.classList.toggle('on', portrait); }
addEventListener('resize', onResize);
// 向きを変えた直後は画面サイズが遅れて変わる端末があるので、少し待って測り直す
addEventListener('orientationchange', () => { for (const ms of [100, 350, 800]) setTimeout(onResize, ms); });
if (screen.orientation) screen.orientation.addEventListener('change', () => setTimeout(onResize, 120));

// ------------------------------------------------------------ テクスチャ（コードで生成）
function canvasTex(w, h, draw, repeat) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); } return t; }
const concreteTex = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#4a4a52'; g.fillRect(0, 0, w, h); for (let i = 0; i < 4000; i++) { const v = 60 + Math.random() * 40 | 0; g.fillStyle = `rgba(${v},${v},${v + 6},.5)`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); } g.strokeStyle = 'rgba(20,20,26,.7)'; g.lineWidth = 2; for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(i * 64, 0); g.lineTo(i * 64, h); g.moveTo(0, i * 64); g.lineTo(w, i * 64); g.stroke(); } }, [10, 3]);

const glowTex = canvasTex(64, 64, (g, w, h) => { const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.3, 'rgba(255,255,255,.6)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
const signTex = canvasTex(512, 128, (g, w, h) => { g.fillStyle = '#000'; g.fillRect(0, 0, w, h); g.font = '900 86px Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.shadowColor = '#ff2040'; g.shadowBlur = 24; g.fillStyle = '#ff3b5c'; g.fillText('S.A.N.T.A.', w / 2, h / 2 + 4); });

// ------------------------------------------------------------ 舞台：夜の屋上
{
  // 空（グラデーションの球）
  const skyGeo = new THREE.SphereGeometry(200, 32, 16), cols = [], top = new THREE.Color(0x02030c), mid = new THREE.Color(0x1a1048), bot = new THREE.Color(0x3a1030);
  const p = skyGeo.attributes.position; for (let i = 0; i < p.count; i++) { const y = p.getY(i) / 200; const c = y > .1 ? mid.clone().lerp(top, (y - .1) / .9) : bot.clone().lerp(mid, (y + .2) / .3); cols.push(c.r, c.g, c.b); }
  skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  scene.add(new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false })));
  // 星
  const sg = new THREE.BufferGeometry(), sp = []; for (let i = 0; i < 900; i++) { const a = rand(0, Math.PI * 2), e = rand(.05, 1.2), r = 190; sp.push(Math.cos(a) * Math.cos(e) * r, Math.sin(e) * r, Math.sin(a) * Math.cos(e) * r); }
  sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ size: .6, color: 0xffffff, fog: false })));
  // 月
  const moon = new THREE.Mesh(new THREE.SphereGeometry(7, 32, 16), new THREE.MeshBasicMaterial({ color: 0xfff1c8, fog: false })); moon.position.set(-30, 42, -120); scene.add(moon);
  const mg = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffe0a0, transparent: true, opacity: .55, depthWrite: false, fog: false, blending: THREE.AdditiveBlending })); mg.scale.set(60, 60, 1); mg.position.copy(moon.position); scene.add(mg);
  // ビル群
  const bm = new THREE.MeshStandardMaterial({ color: 0x0b0c16, roughness: .9, emissive: 0xffffff, emissiveMap: windowTex, emissiveIntensity: .9 });
  windowTex.wrapS = windowTex.wrapT = THREE.RepeatWrapping;
  for (let i = 0; i < 140; i++) { const w = rand(4, 10), h = rand(10, 55), d = rand(4, 10); const bg = new THREE.BoxGeometry(w, h, d), uv = bg.attributes.uv; for (let k = 0; k < uv.count; k++) uv.setXY(k, uv.getX(k) * w / 6, uv.getY(k) * h / 12); const b = new THREE.Mesh(bg, bm); const ang = rand(-1.25, 1.25), r = rand(28, 110); b.position.set(Math.sin(ang) * r, -12 + h / 2 - rand(0, 6), -Math.cos(ang) * r - 6); scene.add(b); }
  // 屋上の床
  const floor = new THREE.Mesh(new THREE.BoxGeometry(34, 1, 12), new THREE.MeshStandardMaterial({ map: concreteTex, roughness: .55, metalness: .1, color: 0x9a9aa6 }));
  floor.position.y = -.5; floor.receiveShadow = true; scene.add(floor);
  // 積雪
  const snowM = new THREE.MeshStandardMaterial({ color: 0xeef3ff, roughness: .9 });
  for (let i = 0; i < 26; i++) { const s = new THREE.Mesh(new THREE.SphereGeometry(rand(.3, .9), 12, 8), snowM); s.scale.y = .25; s.position.set(rand(-16, 16), 0, rand(-5.6, -4) * (Math.random() < .5 ? 1 : -1)); s.receiveShadow = true; scene.add(s); }
  // 手すり
  const railM = new THREE.MeshStandardMaterial({ color: 0x2a2a34, metalness: .8, roughness: .35 });
  const rail = new THREE.Mesh(new THREE.BoxGeometry(34, .08, .08), railM); rail.position.set(0, 1, -5.8); rail.castShadow = true; scene.add(rail);
  for (let x = -16; x <= 16; x += 2) { const p2 = new THREE.Mesh(new THREE.BoxGeometry(.07, 1, .07), railM); p2.position.set(x, .5, -5.8); p2.castShadow = true; scene.add(p2); }
  // 給水塔とアンテナ
  const tank = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, 2.4, 24), new THREE.MeshStandardMaterial({ color: 0x3a2a22, roughness: .7, metalness: .3 })); tank.position.set(-9, 3.3, -4.4); tank.castShadow = true; scene.add(tank);
  for (const [dx, dz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { const l = new THREE.Mesh(new THREE.CylinderGeometry(.06, .06, 2.2), railM); l.position.set(-9 + dx, 1.1, -4.4 + dz * .6); scene.add(l); }
  const ant = new THREE.Mesh(new THREE.CylinderGeometry(.05, .08, 7), railM); ant.position.set(10, 3.5, -4.8); scene.add(ant);
  const beacon = new THREE.Mesh(new THREE.SphereGeometry(.14), new THREE.MeshBasicMaterial({ color: 0xff2030 })); beacon.position.set(10, 7.1, -4.8); scene.add(beacon); scene.userData.beacon = beacon;
  // ネオン看板
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(8, 2), new THREE.MeshBasicMaterial({ map: signTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })); sign.position.set(-11, 2.6, -9); sign.scale.setScalar(.9); scene.add(sign); scene.userData.sign = sign;
  const frame = new THREE.Mesh(new THREE.BoxGeometry(8.4, .1, .1), railM); frame.position.set(-11, 1.65, -9); frame.scale.x = .9; scene.add(frame);
}
// 照明
scene.add(new THREE.HemisphereLight(0x4a5aa0, 0x1a0a10, .55));
const moonLight = new THREE.DirectionalLight(0xb8c8ff, 1.6); moonLight.position.set(-6, 12, 8); moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048); Object.assign(moonLight.shadow.camera, { left: -10, right: 10, top: 8, bottom: -3, near: 1, far: 40 }); moonLight.shadow.bias = -.0005; moonLight.shadow.normalBias = .02;
scene.add(moonLight);
const rimR = new THREE.SpotLight(0xff2a4a, 60, 30, .6, .6, 1.5); rimR.position.set(-8, 6, -4); rimR.target.position.set(0, 1, 0); scene.add(rimR, rimR.target);
const rimB = new THREE.SpotLight(0x3ac8ff, 50, 30, .6, .6, 1.5); rimB.position.set(8, 6, -4); rimB.target.position.set(0, 1, 0); scene.add(rimB, rimB.target);
const neonLight = new THREE.PointLight(0xff2040, 14, 14, 2); neonLight.position.set(-9, 2.4, -7.5); scene.add(neonLight);
const hitLight = new THREE.PointLight(0xffd28a, 0, 8, 2); scene.add(hitLight);
const fill = new THREE.DirectionalLight(0xffe6d0, .7); fill.position.set(0, 3, 10); scene.add(fill);

// 雪
const SNOW = 1600, snowGeo = new THREE.BufferGeometry(), snowPos = new Float32Array(SNOW * 3), snowVel = new Float32Array(SNOW);
for (let i = 0; i < SNOW; i++) { snowPos[i * 3] = rand(-25, 25); snowPos[i * 3 + 1] = rand(0, 18); snowPos[i * 3 + 2] = rand(-12, 10); snowVel[i] = rand(.6, 1.6); }
snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
scene.add(new THREE.Points(snowGeo, new THREE.PointsMaterial({ size: .07, map: glowTex, transparent: true, depthWrite: false, color: 0xffffff })));

// 火花（加算合成のパーティクル）
const PMAX = 900, pGeo = new THREE.BufferGeometry(), pPos = new Float32Array(PMAX * 3), pCol = new Float32Array(PMAX * 3), parts = [];
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3)); pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const pPoints = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: .16, map: glowTex, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
pPoints.frustumCulled = false; scene.add(pPoints);
function burst(pos, color, n = 30, sp = 6, life = .5, grav = -6) { const c = new THREE.Color(color); for (let i = 0; i < n; i++) { if (parts.length >= PMAX) parts.shift(); const v = new THREE.Vector3(rand(-1, 1), rand(-.6, 1), rand(-1, 1)).normalize().multiplyScalar(rand(.3, 1) * sp); parts.push({ p: pos.clone(), v, life: rand(.5, 1) * life, max: life, c, g: grav }); } }
function updParts(dt) {
  for (const q of parts) { q.life -= dt; q.v.y += q.g * dt; q.v.multiplyScalar(1 - 2 * dt); q.p.addScaledVector(q.v, dt); }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1);
  for (let i = 0; i < PMAX; i++) { const q = parts[i]; if (q) { pPos.set([q.p.x, q.p.y, q.p.z], i * 3); const k = clamp(q.life / q.max, 0, 1); pCol.set([q.c.r * k, q.c.g * k, q.c.b * k], i * 3); } else { pPos.set([0, -99, 0], i * 3); } }
  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;
}
// 衝撃波リング

function sparkleDeer(n) { for (let i = 0; i < n; i++) burst(new THREE.Vector3(deer.x + rand(-.5, .5), deer.y + rand(.6, 1.6), rand(-.3, .3)), Math.random() < .5 ? 0xffd860 : 0xff8aa0, 1, 1.2, .5, -1); }
function updDeer(dt) {
  if (!deer) { DEER.g.visible = false; return; }

  let gallop = 0;

  else if (d.ph === 'dive') { const q = Math.min(1, d.t / .38); d.x = lerp(d.sx, d.ex, q); d.y = 6 * Math.pow(1 - q, 2); d.rot = -.5 * (1 - q); sparkleDeer(3); gallop = .5;
    if (q >= 1) { d.ph = 'dash'; d.t = 0; shake = .5; ring(new THREE.Vector3(d.x, .1, 0), 0xffd860, 2.5); burst(new THREE.Vector3(d.x, .1, 0), 0xffffff, 20, 3, .5, -2); noise(.15, .25, 600); } }
  else if (d.ph === 'dash') { d.x += d.dir * 12 * dt; d.y = Math.abs(Math.sin(d.t * 18)) * .08; d.rot = 0; gallop = 1; sparkleDeer(2);
    if (Math.abs(d.x - E.x) < .8 && E.st !== 'ko' && E.y < 1.5) { const wasG = E.st === 'guard' && E.face === -d.dir; damage(P, E, 6, 3, new THREE.Vector3(E.x, 1.3, 0)); if (!wasG && E.st === 'hit') { E.vy = 7; E.stun = 1.3; } say('ANTLER RUSH!'); d.ph = 'buck'; d.t = 0; }

    if (!d.beamed && d.t >= .26) { d.beamed = true; d.beamT = .45; flash(.25, '#ff4060'); shake = .7; tone(1200, .35, 'sawtooth', .06, -800); noise(.3, .3, 3000);
      if (E.st !== 'ko') { damage(P, E, 7, 4, new THREE.Vector3(E.x, 1.3 + E.y, 0)); if (E.st === 'hit') E.vy = Math.max(E.vy, 5); say('RED NOSE FLASH!'); } }
    if (d.t > .75) { d.ph = 'fly'; d.t = 0; melody([[84, .25], [88, .25], [91, .25], [96, .75]]); } }
  else if (d.ph === 'fly') { d.x += d.dir * 5 * dt; d.y += (3 + d.t * 10) * dt; d.rot = -.45; gallop = .6; sparkleDeer(4); if (d.y > 11) { deer = null; DEER.g.visible = false; return; } }

// ミラクル・プレゼント・レイン（ハイパー中の必殺）
function giftRain(tgt) {

    const m = new THREE.Group(); const box = new THREE.Mesh(new THREE.BoxGeometry(.32, .32, .32), new THREE.MeshStandardMaterial({ color: [0xb3122e, 0x2e7a46, 0x3a5aa8, 0xd4af37][i % 4], emissive: 0x401010, roughness: .5 }));

    m.position.set(tgt.x + rand(-1.2, 1.2), 7 + rand(0, 2), rand(-.5, .5)); scene.add(m); gifts.push({ m, vy: -2, vr: rand(-6, 6) });
  }, i * 90);

}
function updGifts(dt) { for (let i = gifts.length - 1; i >= 0; i--) { const g = gifts[i]; g.vy -= 20 * dt; g.m.position.y += g.vy * dt; g.m.rotation.x += g.vr * dt; g.m.rotation.y += g.vr * .7 * dt;

// ------------------------------------------------------------ 人形 → リアルモデルへの変身（人形の部品がはじけ飛び、中から本物が現れる）
let frags = [];
function transform(f) {

  const c = new THREE.Vector3(f.x, 1.1, 0);
  for (const ch of f.root.children) { if (ch === f.aura || ch === f.rig.inner) continue;
    ch.traverse(o => { if (!o.isMesh || !o.visible) return; const m = new THREE.Mesh(o.geometry, o.material); o.getWorldPosition(m.position); o.getWorldQuaternion(m.quaternion); o.getWorldScale(m.scale); m.castShadow = true; scene.add(m);
      const v = m.position.clone().sub(c); v.z += rand(-.3, .3); v.normalize().multiplyScalar(rand(3, 8)); v.y += rand(2, 6);
      frags.push({ m, v, w: new THREE.Vector3(rand(-14, 14), rand(-14, 14), rand(-14, 14)), life: rand(1, 1.6) }); });

}
function updFrags(dt) { for (let i = frags.length - 1; i >= 0; i--) { const q = frags[i]; q.life -= dt; q.v.y -= 14 * dt; q.m.position.addScaledVector(q.v, dt);
  q.m.rotation.x += q.w.x * dt; q.m.rotation.y += q.w.y * dt; q.m.rotation.z += q.w.z * dt; q.m.scale.multiplyScalar(1 - dt * .7);

  f.real = false; for (const ch of f.root.children) ch.visible = ch !== f.rig.inner; f.rig.inner.visible = false; f.cape = f.capeRef; f.mats = null; f.grow = null;
}

// ------------------------------------------------------------ 覚醒（スーパーサンタ／ブラックルフ激昂）
function startXf(f) {

  for (const g of [P, E]) { if (g.st !== 'ko') { act(g, 'idle'); g.vx = 0; } }
  say(f === P ? 'AWAKENING...' : 'BLACKRUF...', f === P ? 'サンタの体に聖夜の力が満ちていく' : 'ブラックルフの怒りが爆発する', true);

}
function updXf(dt) {

    if (isP) setTimeout(() => melody([[72, .25], [76, .25], [79, .25], [84, .75]]), 200); }

function updPower(f, dt, T) {

// ------------------------------------------------------------ HUD
function hud() {

  $('mtrP').style.width = P.meter + '%'; $('mtrE').style.width = E.meter + '%';
  $('mtrPw').classList.toggle('full', P.meter >= 100); $('mtrEw').classList.toggle('full', E.meter >= 100); $('spBtn').classList.toggle('ready', P.meter >= 100);

function reset() {
  for (const [f, x] of [[P, -2.2], [E, 2.2]]) Object.assign(f, { x, y: 0, vx: 0, vy: 0, face: x < 0 ? 1 : -1, hp: 100, meter: 0, st: 'idle', t: 0, combo: 0, flash: 0 });

$('again').addEventListener('click', () => { audio(); reset(); });

// ------------------------------------------------------------ カメラ
const camPos = new THREE.Vector3(0, 2, 9), camLook = new THREE.Vector3(0, 1.1, 0);

// ------------------------------------------------------------ ループ
let last = performance.now(), T = 0;
function frame(now) {

  let dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
  if (portrait) { composer.render(); return; } // 縦画面の間は止める

  hitLight.intensity *= Math.exp(-10 * dt);
  // 雪
  for (let i = 0; i < SNOW; i++) { snowPos[i * 3 + 1] -= snowVel[i] * dt; snowPos[i * 3] += Math.sin(T + i) * .2 * dt; if (snowPos[i * 3 + 1] < 0) snowPos[i * 3 + 1] = 18; }

  scene.userData.beacon.material.color.setHex(Math.sin(T * 4) > 0 ? 0xff2030 : 0x300408);
  neonLight.intensity = 12 + Math.sin(T * 20) * (Math.random() < .03 ? 10 : 1);
  scene.userData.sign.material.opacity = Math.random() < .02 ? .3 : 1;
  updCamera(dt, T); hud();
  composer.render();
}
introT = 1e9; requestAnimationFrame(frame);
setTimeout(() => { $('help').style.transition = 'opacity 1s'; $('help').style.opacity = 0; }, 7000);
