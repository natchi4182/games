<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05070f">
<title>秘密結社 S.A.N.T.A.</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// =====================================================================
//  秘密結社 S.A.N.T.A. — Secret Agency for Nocturnal Toy Allocation
//  6つのミニゲームで、今年のクリスマス作戦を完遂せよ。
// =====================================================================

const W = 360, H = 640;
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
let scale = 1, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * scale) + 'px';
  cv.style.height = (H * scale) + 'px';
  cv.width = Math.round(W * scale * DPR);
  cv.height = Math.round(H * scale * DPR);
}
addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------- utils
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const lerp = (a, b, t) => a + (b - a) * t;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const FONT = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif';
function font(sz, w = 'bold') { cx.font = `${w} ${sz}px ${FONT}`; }
function text(s, x, y, sz, col = '#fff', align = 'center', w = 'bold') {
  font(sz, w); cx.fillStyle = col; cx.textAlign = align; cx.textBaseline = 'middle'; cx.fillText(s, x, y);
}
function textO(s, x, y, sz, col = '#fff', ol = '#000', lw = 4, align = 'center') {
  font(sz); cx.textAlign = align; cx.textBaseline = 'middle'; cx.lineJoin = 'round';
  cx.lineWidth = lw; cx.strokeStyle = ol; cx.strokeText(s, x, y); cx.fillStyle = col; cx.fillText(s, x, y);
}
function wrapLines(s, maxW, sz, w = 'normal') {
  font(sz, w);
  const out = [];
  for (const para of s.split('\n')) {
    let line = '';
    for (const ch of para) {
      if (cx.measureText(line + ch).width > maxW && line) {
        // 行頭禁則（句読点を前の行に残す）
        if ('、。」』）！？ー…'.includes(ch)) { line += ch; out.push(line); line = ''; continue; }
        out.push(line); line = ch;
      } else line += ch;
    }
    out.push(line);
  }
  return out;
}
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  cx.beginPath();
  cx.moveTo(x + r, y); cx.lineTo(x + w - r, y); cx.quadraticCurveTo(x + w, y, x + w, y + r);
  cx.lineTo(x + w, y + h - r); cx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  cx.lineTo(x + r, y + h); cx.quadraticCurveTo(x, y + h, x, y + h - r);
  cx.lineTo(x, y + r); cx.quadraticCurveTo(x, y, x + r, y); cx.closePath();
}

// emoji → offscreen cache（毎フレームの fillText を避ける）
const emoCache = new Map();
function emo(ch, x, y, size, alpha = 1) {
  const k = ch + '|' + size;
  let c = emoCache.get(k);
  if (!c) {
    c = document.createElement('canvas');
    const s = Math.ceil(size * 1.4) * 2;
    c.width = c.height = s;
    const g = c.getContext('2d');
    g.font = `${size * 2}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(ch, s / 2, s / 2 + size * 0.12);
    emoCache.set(k, c);
  }
  if (alpha !== 1) cx.globalAlpha = alpha;
  cx.drawImage(c, x - c.width / 4, y - c.height / 4, c.width / 2, c.height / 2);
  if (alpha !== 1) cx.globalAlpha = 1;
}

// ---------------------------------------------------------------- audio
let AC = null, muted = false;
try { muted = localStorage.getItem('santa_muted') === '1'; } catch (e) {}
function audioInit() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(freq, dur, type = 'square', vol = 0.08, slide = 0, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.05);
}
let noiseBuf = null;
function noise(dur = 0.2, vol = 0.2, freq = 1200, delay = 0) {
  if (!AC || muted) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.6, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime + delay;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + dur + 0.05);
}
const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);
function melody(seq, bpm = 160, type = 'square', vol = 0.06) {
  // seq: [[midi, beats], ...] midi=0 は休符
  let t = 0; const b = 60 / bpm;
  for (const [n, len] of seq) { if (n) tone(NOTE(n), len * b * 0.9, type, vol, 0, t); t += len * b; }
}
const SFX = {
  click: () => tone(880, 0.05, 'square', 0.05),
  type: () => tone(1400 + Math.random() * 300, 0.015, 'square', 0.015),
  beep: () => tone(660, 0.12, 'square', 0.07),
  go: () => { tone(990, 0.25, 'square', 0.08); tone(1320, 0.3, 'triangle', 0.06, 0, 0.05); },
  good: () => { tone(988, 0.07, 'square', 0.06); tone(1319, 0.12, 'square', 0.06, 0, 0.07); },
  bad: () => tone(200, 0.25, 'sawtooth', 0.07, -120),
  flip: () => tone(500, 0.05, 'triangle', 0.08, 300),
  coin: () => { tone(1319, 0.05, 'square', 0.05); tone(1760, 0.1, 'square', 0.05, 0, 0.05); },
  boom: () => { noise(0.45, 0.35, 600); tone(110, 0.35, 'sawtooth', 0.08, -70); },
  shot: () => { noise(0.12, 0.3, 3000); tone(300, 0.08, 'square', 0.05, -200); },
  empty: () => tone(1800, 0.03, 'square', 0.04),
  reload: () => { tone(400, 0.05, 'square', 0.05); tone(700, 0.06, 'square', 0.05, 0, 0.12); },
  hit: () => { noise(0.1, 0.3, 1500); tone(160, 0.1, 'square', 0.07, -60); },
  guard: () => tone(1200, 0.06, 'triangle', 0.06, -400),
  whoosh: () => noise(0.08, 0.08, 4000),
  jump: () => tone(300, 0.12, 'triangle', 0.06, 400),
  drop: () => tone(700, 0.15, 'triangle', 0.05, -400),
  pop: () => { tone(600, 0.06, 'square', 0.05, 600); },
  combo: n => tone(600 + n * 120, 0.12, 'square', 0.06),
  end: () => melody([[76, .5], [79, .5], [84, 1.5]], 220),
  jingle: () => melody([[76, .5], [76, .5], [76, 1], [76, .5], [76, .5], [76, 1], [76, .5], [79, .5], [72, .75], [74, .25], [76, 2]], 220, 'square', 0.05),
  fanfare: () => melody([[72, .33], [72, .33], [72, .33], [72, 1], [68, 1], [70, 1], [72, .66], [70, .33], [72, 2.5]], 150, 'square', 0.06),
  sad: () => melody([[67, 1], [66, 1], [65, 1], [64, 3]], 110, 'triangle', 0.07),
};

// ---------------------------------------------------------------- input
const keys = {};
const ptrs = new Map();
function toLocal(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const p = toLocal(e); ptrs.set(e.pointerId, p);
  if (e.button === 2) { scene.key && scene.key('Reload'); return; }
  scene.down && scene.down(p.x, p.y, e.pointerId);
});
cv.addEventListener('pointermove', e => {
  const p = toLocal(e); if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, p);
  scene.move && scene.move(p.x, p.y, e.pointerId, ptrs.has(e.pointerId));
});
function ptrEnd(e) {
  const p = toLocal(e); ptrs.delete(e.pointerId);
  scene.up && scene.up(p.x, p.y, e.pointerId);
}
cv.addEventListener('pointerup', ptrEnd);
cv.addEventListener('pointercancel', ptrEnd);
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  audioInit();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) { keys[e.code] = true; scene.key && scene.key(e.code); }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ---------------------------------------------------------------- buttons
function Btn(x, y, w, h, label, onTap, opt = {}) { return { x, y, w, h, label, onTap, ...opt }; }
function hit(b, x, y) { return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }
function drawBtn(b, t = 0) {
  const pressed = b._p;
  const col = b.color || '#c8102e', dark = b.dark || '#7a0a1c';
  const oy = pressed ? 3 : 0;
  rr(b.x, b.y + 4, b.w, b.h, 12); cx.fillStyle = dark; cx.fill();
  rr(b.x, b.y + oy, b.w, b.h, 12); cx.fillStyle = col; cx.fill();
  cx.lineWidth = 2; cx.strokeStyle = 'rgba(255,255,255,.35)'; cx.stroke();
  if (b.glow) { cx.globalAlpha = 0.25 + 0.2 * Math.sin(t * 5); rr(b.x - 3, b.y - 3 + oy, b.w + 6, b.h + 6, 14); cx.strokeStyle = '#ffd700'; cx.lineWidth = 3; cx.stroke(); cx.globalAlpha = 1; }
  text(b.label, b.x + b.w / 2, b.y + b.h / 2 + oy + 1, b.size || 18, b.tc || '#fff');
}
// 各シーンで使い回せるボタン処理
const BtnMix = {
  down(x, y) { for (const b of this.btns || []) if (hit(b, x, y)) { b._p = true; this._pb = b; } },
  up(x, y) {
    const b = this._pb; this._pb = null;
    for (const bb of this.btns || []) bb._p = false;
    if (b && hit(b, x, y)) { SFX.click(); b.onTap(); }
  },
};

// ---------------------------------------------------------------- particles
let parts = [];
let shake = 0;
function burst(x, y, col, n = 12, sp = 160, life = 0.6, size = 3) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = sp * (0.3 + Math.random() * 0.7);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life, max: life, col: Array.isArray(col) ? pick(col) : col, size: size * (0.6 + Math.random() * 0.8), g: 300 });
  }
}
function floatText(s, x, y, col = '#fff', sz = 18) {
  parts.push({ x, y, vx: 0, vy: -50, life: 0.9, max: 0.9, txt: s, col, size: sz, g: 0 });
}
function updateParts(dt) {
  for (const p of parts) { p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter(p => p.life > 0);
  shake = Math.max(0, shake - dt * 30);
}
function drawParts() {
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1);
    if (p.txt) { cx.globalAlpha = a; textO(p.txt, p.x, p.y, p.size, p.col, '#000', 4); cx.globalAlpha = 1; }
    else { cx.globalAlpha = a; cx.fillStyle = p.col; cx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); cx.globalAlpha = 1; }
  }
}

// ---------------------------------------------------------------- backdrop
const stars = [...Array(80)].map(() => ({ x: Math.random() * W, y: Math.random() * H * 0.7, r: Math.random() * 1.4 + 0.3, p: Math.random() * 6 }));
const snow = [...Array(70)].map(() => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2 + 0.6, v: Math.random() * 25 + 18, p: Math.random() * 6 }));
let gT = 0;
function drawNight(top = '#060a1c', bot = '#1a1240') {
  const g = cx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, top); g.addColorStop(1, bot);
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  for (const s of stars) { cx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(gT * 1.5 + s.p)); cx.fillStyle = '#fff'; cx.fillRect(s.x, s.y, s.r, s.r); }
  cx.globalAlpha = 1;
}
function drawSnow(dt, alpha = 0.8) {
  cx.fillStyle = '#fff';
  for (const s of snow) {
    s.y += s.v * dt; s.x += Math.sin(gT + s.p) * 12 * dt;
    if (s.y > H + 4) { s.y = -4; s.x = Math.random() * W; }
    cx.globalAlpha = alpha * (s.r / 2.6); cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 7); cx.fill();
  }
  cx.globalAlpha = 1;
}
function drawEmblem(x, y, r) {
  cx.save(); cx.translate(x, y);
  cx.fillStyle = '#7a0a1c'; cx.beginPath(); cx.arc(0, 3, r, 0, 7); cx.fill();
  const g = cx.createRadialGradient(-r * .3, -r * .3, 2, 0, 0, r); g.addColorStop(0, '#ff3b4f'); g.addColorStop(1, '#a50d24');
  cx.fillStyle = g; cx.beginPath(); cx.arc(0, 0, r, 0, 7); cx.fill();
  cx.lineWidth = r * 0.08; cx.strokeStyle = '#ffd700'; cx.beginPath(); cx.arc(0, 0, r * 0.86, 0, 7); cx.stroke();
  // star
  cx.fillStyle = '#fff'; cx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * 0.28 : r * 0.62; cx.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2); }
  cx.closePath(); cx.fill();
  text('S', 0, 2, r * 0.5, '#a50d24', 'center', '900');
  cx.restore();
}
function drawPanel(x, y, w, h, col = 'rgba(8,12,30,.88)') {
  rr(x, y, w, h, 14); cx.fillStyle = col; cx.fill();
  cx.lineWidth = 2; cx.strokeStyle = 'rgba(255,215,0,.45)'; cx.stroke();
}
function hud(title, time, right) {
  cx.fillStyle = 'rgba(0,0,0,.55)'; cx.fillRect(0, 0, W, 44);
  text(title, 10, 22, 14, '#ffd700', 'left');
  if (time != null) {
    const t = Math.max(0, time);
    text(t.toFixed(t < 10 ? 1 : 0), W / 2, 22, 22, t < 6 ? (Math.floor(t * 4) % 2 ? '#ff5050' : '#fff') : '#fff');
  }
  if (right) text(right, W - 10, 22, 15, '#fff', 'right');
}

// ---------------------------------------------------------------- save
const SAVE_KEY = 'santa_ops_v1';
let save = { best: 0, bestRank: '', missions: {} };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = Object.assign(save, s); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

// ---------------------------------------------------------------- scene mgr
let scene = { update() {}, draw() {} };
let fade = 0;
function go(s, arg) { scene = s; fade = 1; parts = []; shake = 0; s.enter && s.enter(arg); }

// =====================================================================
//  MINI GAME 1 : 市場調査（パズル・神経衰弱）
// =====================================================================
function Research(api) {
  const kinds = ['🧸', '🚂', '🎮', '⚽', '🎨', '📚', '🎸', '🚲', '🤖', '🦄'];
  const names = ['エマ', 'ソウタ', 'リオ', 'ハナ', 'ノア', 'ミア', 'ユイ', 'レオ', 'アオイ', 'カイ'];
  const COLS = 4, CW = 72, CH = 84, GAP = 8, X0 = (W - (COLS * CW + (COLS - 1) * GAP)) / 2, Y0 = 108;
  const LIMIT = 55;
  const deck = shuffle(kinds.flatMap((k, i) => [{ k, n: names[i] }, { k, n: names[i] }]));
  const cards = deck.map((d, i) => ({ ...d, i, col: i % COLS, row: Math.floor(i / COLS), open: true, done: false, f: 1, shake: 0 }));
  let time = LIMIT, first = null, lock = 0, found = 0, miss = 0, preview = 2.2, combo = 0;
  function pos(c) { return { x: X0 + c.col * (CW + GAP), y: Y0 + c.row * (CH + GAP) }; }
  function finish() {
    const rate = found / 10 * 0.8 + (found === 10 ? 0.2 * Math.min(1, time / 22) : 0);
    api.end(rate, [`特定した願い: ${found} / 10 件`, `誤照合: ${miss} 回`, `残り時間: ${Math.max(0, time).toFixed(1)} 秒`], found === 10 ? 'ALL MATCHED!' : 'TIME UP');
  }
  return {
    update(dt) {
      for (const c of cards) { c.f = lerp(c.f, c.open || c.done ? 1 : 0, Math.min(1, dt * 14)); c.shake = Math.max(0, c.shake - dt); }
      if (preview > 0) { preview -= dt; if (preview <= 0) cards.forEach(c => c.open = false); return; }
      time -= dt;
      if (lock > 0) { lock -= dt; if (lock <= 0) cards.forEach(c => { if (!c.done) c.open = false; }); }
      if (time <= 0) finish();
    },
    draw() {
      drawNight('#0a1330', '#17254a');
      hud('OP-01 市場調査', preview > 0 ? LIMIT : time, `照合 ${found}/10`);
      text(preview > 0 ? '― 傍受した手紙を記憶せよ ―' : '同じ「願い」のカードを2枚そろえろ', W / 2, 74, 14, preview > 0 ? '#ffd700' : '#9fb3d9');
      if (combo > 1) text(`連続照合 ×${combo}`, W / 2, 94, 12, '#ff8');
      for (const c of cards) {
        const p = pos(c);
        const sx = Math.abs(Math.cos((1 - c.f) * Math.PI / 2 * 2)) * (c.f > 0.5 ? 1 : 1);
        const front = c.f > 0.5;
        const k = front ? (c.f - 0.5) * 2 : (0.5 - c.f) * 2;
        cx.save();
        cx.translate(p.x + CW / 2 + (c.shake > 0 ? Math.sin(c.shake * 60) * 4 : 0), p.y + CH / 2);
        cx.scale(Math.max(0.02, k), 1);
        if (front) {
          rr(-CW / 2, -CH / 2, CW, CH, 10); cx.fillStyle = c.done ? '#d9ffe0' : '#fffaf0'; cx.fill();
          cx.lineWidth = 3; cx.strokeStyle = c.done ? '#2ecc71' : '#e5c07b'; cx.stroke();
          emo(c.k, 0, -8, 34);
          text(c.n + 'より', 0, CH / 2 - 13, 11, '#6b4b2a');
          if (c.done) { cx.globalAlpha = 0.85; text('✔', CW / 2 - 12, -CH / 2 + 12, 16, '#2ecc71'); cx.globalAlpha = 1; }
        } else {
          rr(-CW / 2, -CH / 2, CW, CH, 10); cx.fillStyle = '#8a1022'; cx.fill();
          cx.lineWidth = 3; cx.strokeStyle = '#ffd700'; cx.stroke();
          cx.strokeStyle = 'rgba(255,215,0,.3)'; cx.lineWidth = 1; rr(-CW / 2 + 6, -CH / 2 + 6, CW - 12, CH - 12, 6); cx.stroke();
          drawEmblem(0, -6, 17);
          text('極秘', 0, CH / 2 - 14, 11, '#ffd700');
        }
        cx.restore();
      }
    },
    down(x, y) {
      if (preview > 0 || lock > 0) return;
      for (const c of cards) {
        const p = pos(c);
        if (x >= p.x && x <= p.x + CW && y >= p.y && y <= p.y + CH) {
          if (c.open || c.done) return;
          c.open = true; SFX.flip();
          if (!first) { first = c; return; }
          if (first.k === c.k) {
            first.done = c.done = true; found++; combo++;
            SFX.good(); const q = pos(c); burst(q.x + CW / 2, q.y + CH / 2, ['#ffd700', '#2ecc71', '#fff'], 16);
            floatText(combo > 1 ? `願い特定! ×${combo}` : '願い特定!', q.x + CW / 2, q.y, '#ffd700', 15);
            time += combo > 1 ? 1 : 0;
            first = null;
            if (found === 10) setTimeout(finish, 350);
          } else {
            miss++; combo = 0; SFX.bad(); c.shake = first.shake = 0.3; lock = 0.65; first = null;
          }
          return;
        }
      }
    },
  };
}

// =====================================================================
//  MINI GAME 2 : 資金調達（アクション・キャッチ）
// =====================================================================
function Funding(api) {
  const LIMIT = 40, TARGET = 520, PY = 560;
  const goods = [{ e: '💵', v: 5, w: 50 }, { e: '💰', v: 10, w: 34 }, { e: '💎', v: 30, w: 14 }];
  let time = LIMIT, score = 0, px = W / 2, tx = W / 2, items = [], spT = 0.5, stun = 0, caught = 0, bombs = 0, streak = 0, maxStreak = 0, dragging = false;
  function spawn() {
    const prog = 1 - time / LIMIT;

    move(x, y, id) {
      if (!touches.has(id)) return;
      const cur = touches.get(id);
      if (!HOLD.includes(cur)) return;
      for (const k of ['left', 'right']) if (hit(B[k], x, y) && HOLD.includes(cur) && cur !== 'guard') touches.set(id, k);
    },
    up(x, y, id) { touches.delete(id); },
    key(code) {
      if (code === 'KeyJ' || code === 'KeyZ') act(P, 'punch');

      else if (code === 'KeyW' || code === 'ArrowUp' || code === 'Space') act(P, 'jump');
      else if (code === 'KeyI' || code === 'KeyC') act(P, 'sp');
    },
  };
}

function Delivery(api) {
  const N = 26, GROUND = 600, SX = 92;
  let houses = [], wx = 0, speed = 120, presents = N + 8, drops = [], cool = 0, delivered = 0, spotted = 0, missed = 0, t = 0, endT = -1;
  let x = 380;
  for (let i = 0; i < N; i++) {
    const w = ri(78, 116), h = ri(90, 200), roof = ri(22, 38), chw = 24, chh = ri(22, 36);
    const chx = x + ri(10, w - chw - 10);
    const top = GROUND - h;
    const roofAt = xx => top - roof * (1 - Math.abs((xx - (x + w / 2)) / (w / 2 + 6)));
    const chTop = Math.min(roofAt(chx), roofAt(chx + chw)) - chh;
    houses.push({ x, w, h, top, roof, chx, chw, chTop, roofAt, awake: i > 3 && Math.random() < 0.45, f: rand(0.25, 0.45), ph: Math.random(), done: 0, col: pick(['#6b3e2e', '#4e5d6c', '#7a5c3a', '#5a4a6a', '#3e5e4a']) });
    x += w + ri(26, 70);
  }
  const lastX = x;
  const isAwake = h => h.awake && ((t * h.f + h.ph) % 1) < 0.42;
  function drop() {
    if (presents <= 0 || cool > 0 || endT >= 0) return;
    presents--; cool = 0.2; SFX.drop();
    drops.push({ x: wx + SX, y: sy() + 16, vx: speed * 0.55, vy: 40, r: 0 });
  }
  const sy = () => 128 + Math.sin(t * 2.2) * 10;
  function finish() {
    const rate = delivered / N - spotted * 0.02;
    api.end(rate, [`配達成功: ${delivered} / ${N} 軒`, `子供に目撃: ${spotted} 回`, `ハズレ: ${missed} 個`, `残りプレゼント: ${presents} 個`], 'MERRY CHRISTMAS!');
  }
  return {
    update(dt) {
      t += dt; cool -= dt;
      const prog = clamp(wx / lastX, 0, 1);
      speed = 120 + prog * 50;
      wx += speed * dt;
      for (const d of drops) {
        const py = d.y; d.vy += 540 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.r += dt * 4;
        for (const h of houses) {
          if (d.x < h.x - 4 || d.x > h.x + h.w + 4) continue;
          if (d.x > h.chx + 2 && d.x < h.chx + h.chw - 2 && py <= h.chTop && d.y >= h.chTop) {
            d.dead = true;
            if (h.done) { floatText('配達済み', d.x - wx, h.chTop - 10, '#ccc', 13); missed++; }
            else if (isAwake(h)) { h.done = 2; spotted++; SFX.bad(); floatText('見られた!', d.x - wx, h.chTop - 14, '#ff6b6b', 18); }
            else { h.done = 1; delivered++; SFX.good(); burst(d.x - wx, h.chTop, ['#ffd700', '#fff', '#2ecc71'], 16, 160); floatText('配達完了!', d.x - wx, h.chTop - 14, '#ffd700', 17); }
            break;
          }
          if (d.x >= h.x && d.x <= h.x + h.w && d.y >= h.roofAt(d.x)) { d.dead = true; missed++; SFX.pop(); burst(d.x - wx, d.y, ['#c8102e', '#ffd700'], 8, 100); floatText('ハズレ', d.x - wx, d.y - 10, '#aaa', 12); break; }
        }
        if (!d.dead && d.y >= GROUND) { d.dead = true; missed++; burst(d.x - wx, GROUND, '#fff', 6, 80); }
      }
      drops = drops.filter(d => !d.dead);
      if (endT < 0 && (wx > lastX + 40 || (presents === 0 && drops.length === 0))) endT = 1.0;
      if (endT >= 0) { endT -= dt; if (endT < 0) { endT = 0; finish(); } }
    },
    draw() {
      drawNight('#071030', '#26346a');
      cx.fillStyle = '#fffbe0'; cx.beginPath(); cx.arc(280, 100, 34, 0, 7); cx.fill();
      // far hills
      cx.fillStyle = '#1b2850';
      cx.beginPath(); cx.moveTo(0, GROUND);
      for (let i = 0; i <= 12; i++) { const xx = i * 36 - ((wx * 0.2) % 36); cx.lineTo(xx, GROUND - 130 - Math.sin((i + Math.floor(wx * 0.2 / 36)) * 1.7) * 30); }
      cx.lineTo(W, GROUND); cx.fill();
      // houses
      for (const h of houses) {
        const x0 = h.x - wx; if (x0 > W + 20 || x0 + h.w < -20) continue;
        cx.fillStyle = h.col; cx.fillRect(x0, h.top, h.w, h.h);
        // chimney
        const cxs = h.chx - wx;
        cx.fillStyle = '#7b2d26'; cx.fillRect(cxs, h.chTop, h.chw, h.top - h.chTop + 2);
        cx.fillStyle = '#5a1f1a'; cx.fillRect(cxs - 3, h.chTop, h.chw + 6, 6);
        cx.fillStyle = '#fff'; cx.fillRect(cxs - 3, h.chTop - 3, h.chw + 6, 3);
        // roof
        cx.fillStyle = '#2b1d1a'; cx.beginPath(); cx.moveTo(x0 - 6, h.top); cx.lineTo(x0 + h.w / 2, h.top - h.roof); cx.lineTo(x0 + h.w + 6, h.top); cx.closePath(); cx.fill();
        cx.strokeStyle = '#fff'; cx.lineWidth = 4; cx.beginPath(); cx.moveTo(x0 - 6, h.top); cx.lineTo(x0 + h.w / 2, h.top - h.roof); cx.lineTo(x0 + h.w + 6, h.top); cx.stroke();
        // windows
        const aw = isAwake(h);
        for (let wy = h.top + 18; wy < GROUND - 40; wy += 46) for (const wxo of [14, h.w - 36]) {
          cx.fillStyle = aw ? '#ffe066' : '#1b2a4a'; cx.fillRect(x0 + wxo, wy, 22, 24);
          cx.strokeStyle = '#2b1d1a'; cx.lineWidth = 2; cx.strokeRect(x0 + wxo, wy, 22, 24);
          if (aw && wy === h.top + 18 && wxo === 14) emo('👀', x0 + wxo + 11, wy + 13, 14);
        }
        cx.fillStyle = '#3b2314'; cx.fillRect(x0 + h.w / 2 - 10, GROUND - 34, 20, 34);
        if (h.done === 1) { emo('🎁', cxs + h.chw / 2, h.chTop - 22, 18); }
        if (h.done === 2) { emo('😲', cxs + h.chw / 2, h.chTop - 22, 18); }
        if (h.awake && !h.done) text(aw ? '起きてる!' : 'zzz', x0 + h.w / 2, h.top - h.roof - 12, 10, aw ? '#ff6b6b' : '#9fb3d9');
      }
      cx.fillStyle = '#eef3fb'; cx.fillRect(0, GROUND, W, H - GROUND);
      // drops
      for (const d of drops) { cx.save(); cx.translate(d.x - wx, d.y); cx.rotate(d.r); emo('🎁', 0, 0, 18); cx.restore(); }
      // sleigh
      const yy = sy();
      emo('🦌', SX + 74, yy - 6, 26); emo('🦌', SX + 46, yy - 2, 26);
      cx.strokeStyle = '#c9a227'; cx.lineWidth = 1.5; cx.beginPath(); cx.moveTo(SX + 18, yy + 2); cx.lineTo(SX + 40, yy + 2); cx.moveTo(SX + 18, yy + 2); cx.lineTo(SX + 66, yy - 2); cx.stroke();
      cx.save(); cx.translate(SX, yy);
      cx.fillStyle = '#c8102e'; cx.beginPath(); cx.moveTo(-28, -8); cx.lineTo(20, -8); cx.quadraticCurveTo(26, 8, 10, 12); cx.lineTo(-24, 12); cx.quadraticCurveTo(-34, 4, -28, -8); cx.fill();
      cx.strokeStyle = '#ffd700'; cx.lineWidth = 3; cx.beginPath(); cx.moveTo(-30, 18); cx.lineTo(18, 18); cx.quadraticCurveTo(28, 18, 26, 10); cx.stroke();
      emo('🎅', -8, -16, 24);
      cx.fillStyle = '#111'; cx.fillRect(-16, -22, 16, 4);
      cx.restore();
      // HUD
      const prog = clamp(wx / lastX, 0, 1);
      cx.fillStyle = 'rgba(0,0,0,.5)'; rr(12, 54, W - 24, 10, 5); cx.fill();
      cx.fillStyle = '#9fd3ff'; rr(12, 54, (W - 24) * prog, 10, 5); cx.fill();
      emo('🛷', 12 + (W - 24) * prog, 59, 14);
      text('画面タップでプレゼント投下 ／ 窓が光る家は子供が起きてるぞ', W / 2, 80, 11, '#cfe0ff');
      hud('OP-06 配達', null, `🎁×${presents}  配達 ${delivered}/${N}`);
    },
    down() { drop(); },
    key(code) { if (code === 'Space' || code === 'Enter' || code === 'ArrowDown') drop(); },
  };
}

    ...BtnMix,
    enter(arg) {
      this.cfg = typeof cfg === 'function' ? cfg(arg) : cfg; this.t = 0; this.n = 0;
      this.lines = wrapLines(this.cfg.body, W - 64, 15);

    },
    update(dt) {
      this.t += dt;
      const prev = Math.floor(this.n);
      if (this.n < this.total) { this.n = Math.min(this.total, this.n + dt * 38); if (Math.floor(this.n) !== prev && Math.floor(this.n) % 2) SFX.type(); }
    },
    draw(dt) {
      drawNight('#04060f', '#141030'); drawSnow(dt, 0.4);
      this.cfg.head(this.t);
      drawPanel(16, this.cfg.top || 196, W - 32, (this.cfg.bottom || 540) - (this.cfg.top || 196));
      let left = Math.floor(this.n), y = (this.cfg.top || 196) + 26;
      for (const l of this.lines) {
        const s = l.slice(0, Math.max(0, left)); left -= l.length;
        text(s, 32, y, 15, '#e8ecff', 'left', 'normal'); y += 24;

      }
      for (const b of this.btns) { b.label = this.n < this.total ? '▶ スキップ' : this.cfg.btn; drawBtn(b, this.t); }
    },
    down(x, y) { BtnMix.down.call(this, x, y); if (!this._pb && this.n < this.total) this.n = this.total; },
  };
}

      textO(`${m.code} ${m.name}`, W / 2, 130, 26, '#ffd700', '#7a0a1c', 5);
      rr(W / 2 - 60, 146, 120, 20, 10); cx.fillStyle = '#c8102e'; cx.fill();
      text(m.genre, W / 2, 156, 12, '#fff');
    },
    body: m.story + '\n\n【操作】\n' + m.how,
    next: () => go(Play, i),
  };
});

const Play = {
  enter(i) {
    this.i = i; this.m = MISSIONS[i]; this.done = null; this.cd = 3.6; this.last = 4;
    this.g = this.m.make({ end: (rate, lines, msg) => { if (this.done) return; this.done = { rate: clamp(rate, 0, 1), lines, msg: msg || 'MISSION END', t: 0 }; SFX.end(); } });
  },
  update(dt) {
    if (this.cd > 0) {
      this.cd -= dt; const n = Math.ceil(this.cd - 0.6);
      if (n !== this.last) { this.last = n; if (n > 0) SFX.beep(); else if (n === 0) SFX.go(); }
      return;
    }
    if (this.done) { this.done.t += dt; if (this.done.t > 1.8) go(Result, { i: this.i, ...this.done }); return; }
    this.g.update(dt);
  },
  draw() {
    cx.save();
    if (shake > 0) cx.translate(rand(-shake, shake) * 0.6, rand(-shake, shake) * 0.6);
    this.g.draw(); drawParts();
    cx.restore();
    if (this.cd > 0) {
      cx.fillStyle = 'rgba(0,0,0,.45)'; cx.fillRect(0, 0, W, H);
      const n = Math.ceil(this.cd - 0.6);
      const f = (this.cd - 0.6) % 1;
      textO(n > 0 ? String(n) : 'START!', W / 2, H / 2 - 20, n > 0 ? 80 + f * 30 : 54, '#fff', '#c8102e', 8);
      text(`${this.m.code} ${this.m.name}`, W / 2, H / 2 + 50, 16, '#ffd700');
    }
    if (this.done) {
      cx.fillStyle = `rgba(0,0,0,${Math.min(0.55, this.done.t)})`; cx.fillRect(0, 0, W, H);
      const s = Math.min(1, this.done.t * 4);
      cx.save(); cx.translate(W / 2, H / 2 - 20); cx.scale(s, s);
      textO(this.done.msg, 0, 0, this.done.msg.length > 10 ? 30 : 42, '#ffd700', '#7a0a1c', 7);
      cx.restore();
    }
  },
  down(x, y, id) { if (this.cd > 0 || this.done) return; this.g.down && this.g.down(x, y, id); },
  move(x, y, id, d) { if (this.cd > 0 || this.done) return; this.g.move && this.g.move(x, y, id, d); },
  up(x, y, id) { this.g.up && this.g.up(x, y, id); },
  key(c) { if (this.cd > 0 || this.done) return; this.g.key && this.g.key(c); },
};

const COMMENTS = {
  S: ['完璧だ。君は伝説になる。', '非の打ち所がない仕事ぶりだ。'],
  A: ['見事な手際だ。', '優秀だ。この調子で頼む。'],
  B: ['悪くない。だが、まだやれるはずだ。', '及第点だ。次で取り返せ。'],
  C: ['危なかったな…気を引き締めろ。', 'ギリギリだ。子供たちの夢がかかっているぞ。'],
  D: ['これでは作戦に支障が出る…！', '厳しい結果だ。だが次がある。'],
};
const Result = {
  ...BtnMix,
  enter(a) {
    this.a = a; this.t = 0; this.shown = 0; this.g = gradeOf(a.rate); this.comment = pick(COMMENTS[this.g]); this.played = false;
    const m = MISSIONS[a.i];
    const prev = save.missions[m.id] || 0;
    this.newBest = a.rate > prev; if (this.newBest) { save.missions[m.id] = a.rate; persist(); }
    if (G.mode === 'campaign') {
      G.results[a.i] = a.rate;
      const last = a.i === MISSIONS.length - 1;
      this.btns = [Btn(60, 556, 240, 56, last ? '最終評価へ' : '次の作戦へ ▶', () => { if (last) go(Final); else go(Briefing, a.i + 1); }, { glow: true, size: 20 })];
    } else {
      this.btns = [
        Btn(30, 556, 145, 56, 'もう一度', () => go(Briefing, a.i), { size: 18 }),
        Btn(185, 556, 145, 56, '訓練メニュー', () => go(Training), { color: '#1f3a68', dark: '#0f1f3a', size: 16 }),
      ];
    }
  },
  update(dt) {
    this.t += dt;
    this.shown = Math.min(this.a.rate, this.shown + dt * 0.8);
    if (!this.played && this.shown >= this.a.rate) { this.played = true; if (this.g === 'S' || this.g === 'A') SFX.jingle(); else if (this.g === 'D') SFX.sad(); else SFX.good(); }
  },
  draw(dt) {
    drawNight('#04060f', '#141030'); drawSnow(dt, 0.5);
    const m = MISSIONS[this.a.i];
    text('MISSION REPORT', W / 2, 40, 14, '#9fb3d9');
    emo(m.icon, W / 2, 86, 40);
    textO(`${m.code} ${m.name}`, W / 2, 134, 24, '#fff', '#000', 4);
    drawPanel(20, 160, W - 40, 370);
    text('達成率', W / 2, 190, 14, '#9fb3d9');
    text(`${(this.shown * 100).toFixed(1)}%`, W / 2, 232, 48, '#fff');
    cx.fillStyle = '#222'; rr(40, 266, W - 80, 14, 7); cx.fill();
    cx.fillStyle = this.shown >= 0.8 ? '#ffd700' : this.shown >= 0.4 ? '#6bc5ff' : '#e74c3c'; rr(40, 266, (W - 80) * this.shown, 14, 7); cx.fill();
    if (this.played) {
      const s = Math.min(1, (this.t - this.a.rate / 0.8) * 5 + 0.2);
      cx.save(); cx.translate(W - 70, 214); cx.scale(Math.max(0.01, s), Math.max(0.01, s)); cx.rotate(-0.2);
      cx.strokeStyle = gradeCol[this.g]; cx.lineWidth = 4; cx.beginPath(); cx.arc(0, 0, 30, 0, 7); cx.stroke();
      text(this.g, 0, 2, 40, gradeCol[this.g], 'center', '900');
      cx.restore();
      if (this.newBest && save.missions[m.id] === this.a.rate && G.mode === 'training') text('★自己ベスト更新', W / 2, 296, 12, '#ffd700');
    }
    let y = 322;
    for (const l of this.a.lines) { text(l, 44, y, 15, '#e8ecff', 'left', 'normal'); y += 28; }
    if (this.played) {
      text('長官より:', 44, 474, 12, '#ffd700', 'left');
      const ls = wrapLines(`「${this.comment}」`, W - 90, 14);
      ls.forEach((l, k) => text(l, 44, 498 + k * 20, 14, '#fff', 'left', 'normal'));
    }
    if (this.played) for (const b of this.btns) drawBtn(b, this.t);
  },
  down(x, y) { if (!this.played) { this.shown = this.a.rate; return; } BtnMix.down.call(this, x, y); },
};

const RANKS = [
  { min: 95, r: 'S', title: '伝説のサンタクロース', msg: '世界中の子供たちが、最高の笑顔で朝を迎えた。君の名は、結社の歴史に永遠に刻まれるだろう。来年は君が長官だ。' },
  { min: 85, r: 'A', title: '筆頭エージェント', msg: 'ほぼ完璧な作戦だった。子供たちの歓声が北極まで届いている。今夜はゆっくりココアでも飲んでくれ。' },
  { min: 70, r: 'B', title: '一人前のエージェント', msg: '作戦は成功だ。いくつか取りこぼしはあったが、多くの子供たちが喜んでいる。来年はさらに上を目指せ。' },
  { min: 50, r: 'C', title: '見習いエージェント', msg: 'なんとか夜は明けた…。プレゼントが届かなかった家もある。トナカイたちと共に、一から鍛え直しだ。' },
  { min: 0, r: 'D', title: '石炭係', msg: 'これは…惨敗だ。K.R.A.M.P.U.S. の高笑いが聞こえる。君には来年、石炭の配達から始めてもらう。' },
];
const Final = {
  ...BtnMix,
  enter() {
    this.t = 0;
    const rs = MISSIONS.map((m, i) => G.results[i] || 0);
    this.total = rs.reduce((a, b) => a + b, 0) / rs.length * 100;
    this.rank = RANKS.find(r => this.total >= r.min);
    this.kids = Math.round(this.total / 100 * 2200000000);
    this.newBest = this.total > save.best;
    if (this.newBest) { save.best = this.total; save.bestRank = this.rank.r; persist(); }
    this.btns = [
      Btn(30, 576, 145, 50, 'もう一度挑戦', () => { G.mode = 'campaign'; G.results = []; G.codename = pick(CODENAMES); go(Prologue); }, { size: 16 }),
      Btn(185, 576, 145, 50, 'タイトルへ', () => go(Title), { color: '#1f3a68', dark: '#0f1f3a', size: 16 }),
    ];
    this.played = false;
  },
  update(dt) {
    this.t += dt;
    if (!this.played && this.t > 2.6) { this.played = true; if (this.total >= 70) SFX.fanfare(); else SFX.sad(); if (this.total >= 85) for (let i = 0; i < 4; i++) setTimeout(() => burst(rand(60, 300), rand(100, 260), ['#ffd700', '#ff6b6b', '#6bc5ff', '#2ecc71', '#fff'], 40, 260, 1.2, 4), i * 300); }
  },
  draw(dt) {
    drawNight('#0a1030', '#3a2050');
    cx.fillStyle = 'rgba(255,200,120,.15)'; cx.beginPath(); cx.arc(W / 2, H + 120, 300, 0, 7); cx.fill();
    drawSnow(dt);
    text('12月25日 早朝 ― 最終作戦報告', W / 2, 30, 13, '#9fb3d9');
    textO('MISSION COMPLETE', W / 2, 62, 26, '#ffd700', '#7a0a1c', 6);
    drawPanel(16, 86, W - 32, 220);
    MISSIONS.forEach((m, i) => {
      const r = G.results[i] || 0, y = 108 + i * 33;
      const k = clamp((this.t - i * 0.25) * 2, 0, 1);
      cx.globalAlpha = k;
      emo(m.icon, 34, y, 16);
      text(m.name, 50, y, 13, '#fff', 'left');
      cx.fillStyle = '#222'; rr(150, y - 6, 120, 12, 6); cx.fill();
      cx.fillStyle = gradeCol[gradeOf(r)]; rr(150, y - 6, 120 * r * k, 12, 6); cx.fill();
      text(`${Math.round(r * 100 * k)}%`, 308, y, 13, '#fff', 'right');
      text(gradeOf(r), 326, y, 14, gradeCol[gradeOf(r)], 'center', '900');
      cx.globalAlpha = 1;
    });
    const k2 = clamp((this.t - 1.6) / 1.0, 0, 1);
    text('総合達成率', W / 2, 330, 14, '#9fb3d9');
    text(`${(this.total * k2).toFixed(1)}%`, W / 2, 370, 50, '#fff');
    if (this.t > 2.6) {
      const s = Math.min(1, (this.t - 2.6) * 4);
      cx.save(); cx.translate(W - 62, 362); cx.scale(s, s); cx.rotate(-0.2);
      cx.strokeStyle = gradeCol[this.rank.r]; cx.lineWidth = 5; cx.beginPath(); cx.arc(0, 0, 32, 0, 7); cx.stroke();
      text(this.rank.r, 0, 2, 44, gradeCol[this.rank.r], 'center', '900');
      cx.restore();
      textO(`称号: ${this.rank.title}`, W / 2, 412, 19, gradeCol[this.rank.r], '#000', 4);
      text(`笑顔になった子供たち: 約${(this.kids / 1e8).toFixed(1)}億人`, W / 2, 440, 13, '#ffe9b0');
      drawPanel(16, 456, W - 32, 108, 'rgba(8,12,30,.8)');
      const ls = wrapLines(this.rank.msg, W - 64, 13);
      ls.slice(0, 5).forEach((l, i) => text(l, 32, 476 + i * 19, 13, '#fff', 'left', 'normal'));
      for (const b of this.btns) drawBtn(b, this.t);
      if (this.newBest) text('★ NEW RECORD', W / 2 + 112, 330, 12, '#ffd700');
    }
    drawParts();
  },
  down(x, y) { if (this.t < 2.6) { this.t = 2.6; return; } BtnMix.down.call(this, x, y); },
};

const Training = {
  ...BtnMix,
  enter() {
    this.t = 0;
    this.btns = MISSIONS.map((m, i) => Btn(24, 110 + i * 68, W - 48, 58, '', () => { G.mode = 'training'; go(Briefing, i); }, { color: '#1a2547', dark: '#0b1228', m }));
    this.btns.push(Btn(110, 530 + 50, 140, 44, '◀ タイトル', () => go(Title), { color: '#333', dark: '#111', size: 15 }));
  },
  update(dt) { this.t += dt; },
  draw(dt) {
    drawNight('#04060f', '#141030'); drawSnow(dt, 0.4);
    textO('訓練モード', W / 2, 44, 26, '#ffd700', '#7a0a1c', 5);
    text('好きなミッションを練習できる', W / 2, 78, 13, '#9fb3d9', 'center', 'normal');
    for (const b of this.btns) {
      drawBtn(b, this.t);
      if (b.m) {
        const best = save.missions[b.m.id];
        emo(b.m.icon, b.x + 30, b.y + 29, 26);
        text(`${b.m.code} ${b.m.name}`, b.x + 58, b.y + 21, 16, '#fff', 'left');
        text(b.m.genre, b.x + 58, b.y + 41, 11, '#9fb3d9', 'left', 'normal');
        if (best != null) { text(`${Math.round(best * 100)}%`, b.x + b.w - 44, b.y + 29, 15, '#fff', 'right'); text(gradeOf(best), b.x + b.w - 20, b.y + 29, 20, gradeCol[gradeOf(best)], 'center', '900'); }
        else text('未プレイ', b.x + b.w - 14, b.y + 29, 12, '#777', 'right');
      }
    }
  },
};

// =====================================================================
//  MAIN LOOP
// =====================================================================
go(Title);
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; gT += dt;
  cx.setTransform(scale * DPR, 0, 0, scale * DPR, 0, 0);
  scene.update(dt);
  updateParts(dt);
  scene.draw(dt);
  if (fade > 0) { cx.fillStyle = `rgba(0,0,0,${fade})`; cx.fillRect(0, 0, W, H); fade = Math.max(0, fade - dt * 4); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// テスト用フック
window.__santa = { go, scenes: { Title, Prologue, Briefing, Play, Result, Final, Training }, G, MISSIONS };
</script>
</body>
</html>
