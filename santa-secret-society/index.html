<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07070a">
<title>秘密結社 S.A.N.T.A.</title>
<style>
  html, body { margin: 0; height: 100%; background: #07070a; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// =====================================================================
//  秘密結社 S.A.N.T.A. — Secret Agency for Nocturnal Toy Allocation
//  6つのミニゲームで、今年のクリスマス作戦を完遂せよ。
// =====================================================================

const W = 360, H = 640;
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
let scale = 1, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * scale) + 'px';
  cv.style.height = (H * scale) + 'px';
  cv.width = Math.round(W * scale * DPR);
  cv.height = Math.round(H * scale * DPR);
}
addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------- utils
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const lerp = (a, b, t) => a + (b - a) * t;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const FONT = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif';
function font(sz, w = 'bold') { cx.font = `${w} ${sz}px ${FONT}`; }
function text(s, x, y, sz, col = '#fff', align = 'center', w = 'bold') {
  font(sz, w); cx.fillStyle = col; cx.textAlign = align; cx.textBaseline = 'middle'; cx.fillText(s, x, y);
}
function textO(s, x, y, sz, col = '#fff', ol = '#000', lw = 4, align = 'center') {
  font(sz); cx.textAlign = align; cx.textBaseline = 'middle'; cx.lineJoin = 'round';
  cx.lineWidth = lw; cx.strokeStyle = ol; cx.strokeText(s, x, y); cx.fillStyle = col; cx.fillText(s, x, y);
}
function wrapLines(s, maxW, sz, w = 'normal') {
  font(sz, w);
  const out = [];
  for (const para of s.split('\n')) {
    let line = '';
    for (const ch of para) {
      if (cx.measureText(line + ch).width > maxW && line) {
        // 行頭禁則（句読点を前の行に残す）
        const m = line.match(/[A-Za-z0-9.]+$/);
        if (/[A-Za-z0-9.]/.test(ch) && m && m[0].length < line.length) { out.push(line.slice(0, -m[0].length)); line = m[0] + ch; continue; }
        if ('、。」』）！？ー…'.includes(ch)) { line += ch; out.push(line); line = ''; continue; }
        out.push(line); line = ch;
      } else line += ch;
    }
    out.push(line);
  }
  return out;
}
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  cx.beginPath();
  cx.moveTo(x + r, y); cx.lineTo(x + w - r, y); cx.quadraticCurveTo(x + w, y, x + w, y + r);
  cx.lineTo(x + w, y + h - r); cx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  cx.lineTo(x + r, y + h); cx.quadraticCurveTo(x, y + h, x, y + h - r);
  cx.lineTo(x, y + r); cx.quadraticCurveTo(x, y, x + r, y); cx.closePath();
}

// emoji → offscreen cache（毎フレームの fillText を避ける）
const emoCache = new Map();
function emo(ch, x, y, size, alpha = 1) {
  const k = ch + '|' + size;
  let c = emoCache.get(k);
  if (!c) {
    c = document.createElement('canvas');
    const s = Math.ceil(size * 1.4) * 2;
    c.width = c.height = s;
    const g = c.getContext('2d');
    g.font = `${size * 2}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(ch, s / 2, s / 2 + size * 0.12);
    emoCache.set(k, c);
  }
  if (alpha !== 1) cx.globalAlpha = alpha;
  cx.drawImage(c, x - c.width / 4, y - c.height / 4, c.width / 2, c.height / 2);
  if (alpha !== 1) cx.globalAlpha = 1;
}

// ---------------------------------------------------------------- audio
let AC = null, muted = false;
try { muted = localStorage.getItem('santa_muted') === '1'; } catch (e) {}
function audioInit() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(freq, dur, type = 'square', vol = 0.08, slide = 0, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.05);
}
let noiseBuf = null;
function noise(dur = 0.2, vol = 0.2, freq = 1200, delay = 0) {
  if (!AC || muted) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.6, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime + delay;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + dur + 0.05);
}
const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);
function melody(seq, bpm = 160, type = 'square', vol = 0.06) {
  // seq: [[midi, beats], ...] midi=0 は休符
  let t = 0; const b = 60 / bpm;
  for (const [n, len] of seq) { if (n) tone(NOTE(n), len * b * 0.9, type, vol, 0, t); t += len * b; }
}
const SFX = {
  click: () => tone(880, 0.05, 'square', 0.05),
  type: () => tone(1400 + Math.random() * 300, 0.015, 'square', 0.015),
  beep: () => tone(660, 0.12, 'square', 0.07),
  go: () => { tone(990, 0.25, 'square', 0.08); tone(1320, 0.3, 'triangle', 0.06, 0, 0.05); },
  good: () => { tone(988, 0.07, 'square', 0.06); tone(1319, 0.12, 'square', 0.06, 0, 0.07); },
  bad: () => tone(200, 0.25, 'sawtooth', 0.07, -120),
  flip: () => tone(500, 0.05, 'triangle', 0.08, 300),
  coin: () => { tone(1319, 0.05, 'square', 0.05); tone(1760, 0.1, 'square', 0.05, 0, 0.05); },
  boom: () => { noise(0.45, 0.35, 600); tone(110, 0.35, 'sawtooth', 0.08, -70); },
  shot: () => { noise(0.12, 0.3, 3000); tone(300, 0.08, 'square', 0.05, -200); },
  empty: () => tone(1800, 0.03, 'square', 0.04),
  reload: () => { tone(400, 0.05, 'square', 0.05); tone(700, 0.06, 'square', 0.05, 0, 0.12); },
  hit: () => { noise(0.1, 0.3, 1500); tone(160, 0.1, 'square', 0.07, -60); },
  guard: () => tone(1200, 0.06, 'triangle', 0.06, -400),
  whoosh: () => noise(0.08, 0.08, 4000),
  jump: () => tone(300, 0.12, 'triangle', 0.06, 400),
  drop: () => tone(700, 0.15, 'triangle', 0.05, -400),
  pop: () => { tone(600, 0.06, 'square', 0.05, 600); },
  combo: n => tone(600 + n * 120, 0.12, 'square', 0.06),
  end: () => melody([[76, .5], [79, .5], [84, 1.5]], 220),
  jingle: () => melody([[76, .5], [76, .5], [76, 1], [76, .5], [76, .5], [76, 1], [76, .5], [79, .5], [72, .75], [74, .25], [76, 2]], 220, 'square', 0.05),
  fanfare: () => melody([[72, .33], [72, .33], [72, .33], [72, 1], [68, 1], [70, 1], [72, .66], [70, .33], [72, 2.5]], 150, 'square', 0.06),
  sad: () => melody([[67, 1], [66, 1], [65, 1], [64, 3]], 110, 'triangle', 0.07),
};

// ---------------------------------------------------------------- input
const keys = {};
const ptrs = new Map();
function toLocal(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const p = toLocal(e); ptrs.set(e.pointerId, p);
  if (e.button === 2) { scene.key && scene.key('Reload'); return; }
  scene.down && scene.down(p.x, p.y, e.pointerId);
});
cv.addEventListener('pointermove', e => {
  const p = toLocal(e); if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, p);
  scene.move && scene.move(p.x, p.y, e.pointerId, ptrs.has(e.pointerId));
});
function ptrEnd(e) {
  const p = toLocal(e); ptrs.delete(e.pointerId);
  scene.up && scene.up(p.x, p.y, e.pointerId);
}
cv.addEventListener('pointerup', ptrEnd);
cv.addEventListener('pointercancel', ptrEnd);
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  audioInit();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) { keys[e.code] = true; scene.key && scene.key(e.code); }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ---------------------------------------------------------------- theme（スパイ映画風: 黒 × 深紅 × 金）
const INK = '#07070a', CRIM = '#b3122e', CRIM2 = '#5e0816', GOLD = '#d4af37', GOLD2 = '#f6e09a', GOLD3 = '#8a6a1c', PAPER = '#ece4cf';
const SERIF = '"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP","Times New Roman",serif';
const MONO = '"SF Mono","Menlo","Consolas","Roboto Mono","Courier New",monospace';
function goldGrad(y0, y1) {
  const g = cx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, GOLD2); g.addColorStop(0.5, GOLD); g.addColorStop(1, GOLD3); return g;
}
// 字間をあけて描く（タイトル・ラベル用）
function spaced(s, x, y, sz, col, sp = 2, align = 'center', ff = MONO, w = 'bold') {
  cx.font = `${w} ${sz}px ${ff}`; cx.fillStyle = col; cx.textBaseline = 'middle'; cx.textAlign = 'left';
  const ch = [...s], ws = ch.map(c => cx.measureText(c).width);
  const tot = ws.reduce((a, b) => a + b, 0) + sp * (ch.length - 1);
  let xx = align === 'center' ? x - tot / 2 : align === 'right' ? x - tot : x;
  ch.forEach((c, i) => { cx.fillText(c, xx, y); xx += ws[i] + sp; });
  return tot;
}
function serifText(s, x, y, sz, col, align = 'center', w = 'bold') {
  cx.font = `${w} ${sz}px ${SERIF}`; cx.fillStyle = col; cx.textAlign = align; cx.textBaseline = 'middle'; cx.fillText(s, x, y);
}
function mono(s, x, y, sz, col = '#fff', align = 'center', w = 'bold') {
  cx.font = `${w} ${sz}px ${MONO}`; cx.fillStyle = col; cx.textAlign = align; cx.textBaseline = 'middle'; cx.fillText(s, x, y);
}
// 角を斜めに落とした四角（スパイ映画の UI っぽさ）
function bevel(x, y, w, h, c = 10) {
  cx.beginPath();
  cx.moveTo(x + c, y); cx.lineTo(x + w, y); cx.lineTo(x + w, y + h - c); cx.lineTo(x + w - c, y + h);
  cx.lineTo(x, y + h); cx.lineTo(x, y + c); cx.closePath();
}
function corners(x, y, w, h, len = 12, col = GOLD, lw = 2) {
  cx.strokeStyle = col; cx.lineWidth = lw; cx.beginPath();
  cx.moveTo(x, y + len); cx.lineTo(x, y); cx.lineTo(x + len, y);
  cx.moveTo(x + w - len, y); cx.lineTo(x + w, y); cx.lineTo(x + w, y + len);
  cx.moveTo(x + w, y + h - len); cx.lineTo(x + w, y + h); cx.lineTo(x + w - len, y + h);
  cx.moveTo(x + len, y + h); cx.lineTo(x, y + h); cx.lineTo(x, y + h - len);
  cx.stroke();
}
function goldRule(y, x0 = 40, x1 = W - 40) {
  const g = cx.createLinearGradient(x0, 0, x1, 0);
  g.addColorStop(0, 'rgba(212,175,55,0)'); g.addColorStop(0.5, GOLD); g.addColorStop(1, 'rgba(212,175,55,0)');
  cx.fillStyle = g; cx.fillRect(x0, y, x1 - x0, 1);
  const m = (x0 + x1) / 2; cx.fillStyle = GOLD; cx.beginPath(); cx.moveTo(m, y - 4); cx.lineTo(m + 4, y + 0.5); cx.lineTo(m, y + 5); cx.lineTo(m - 4, y + 0.5); cx.fill();
}
// ゴム印（評価スタンプ）
function stamp(x, y, label, sub, col, s = 1, rot = -0.2, r = 36) {
  cx.save(); cx.translate(x, y); cx.rotate(rot); cx.scale(s, s);
  cx.globalAlpha *= 0.92;
  cx.strokeStyle = col; cx.lineWidth = 3.5; cx.beginPath(); cx.arc(0, 0, r, 0, 7); cx.stroke();
  cx.lineWidth = 1.5; cx.beginPath(); cx.arc(0, 0, r - 6, 0, 7); cx.stroke();
  serifText(label, 0, -2, r * 1.05, col, 'center', '900');
  if (sub) spaced(sub, 0, r * 0.62, 7, col, 1.5);
  cx.restore();
}
function rectStamp(x, y, s, col = CRIM, rot = -0.18, sz = 13) {
  cx.save(); cx.translate(x, y); cx.rotate(rot);
  cx.font = `900 ${sz}px ${MONO}`; const w = cx.measureText(s).width + s.length * 2 + 18;
  cx.strokeStyle = col; cx.lineWidth = 2.5; cx.strokeRect(-w / 2, -sz, w, sz * 2);
  cx.lineWidth = 1; cx.strokeRect(-w / 2 + 3, -sz + 3, w - 6, sz * 2 - 6);
  spaced(s, 0, 1, sz, col, 2, 'center', MONO, '900');
  cx.restore();
}

// ---------------------------------------------------------------- buttons
function Btn(x, y, w, h, label, onTap, opt = {}) { return { x, y, w, h, label, onTap, ...opt }; }
function hit(b, x, y) { return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }
function drawBtn(b, t = 0) {
  const p = b._p ? 1 : 0;
  const kind = b.kind || 'primary';
  const x = b.x, y = b.y + p, w = b.w, h = b.h, c = Math.min(12, h * 0.28);
  cx.save();
  if (kind === 'primary') {
    cx.shadowColor = 'rgba(179,18,46,.55)'; cx.shadowBlur = b.glow ? 14 + 6 * Math.sin(t * 3) : 8;
    const g = cx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, p ? '#8e0e24' : '#c9173a'); g.addColorStop(1, p ? '#45050f' : '#6e0a1b');
    bevel(x, y, w, h, c); cx.fillStyle = g; cx.fill(); cx.shadowBlur = 0;
    cx.lineWidth = 1.5; cx.strokeStyle = goldGrad(y, y + h); cx.stroke();
    bevel(x + 4, y + 4, w - 8, h - 8, c - 3); cx.lineWidth = 0.7; cx.strokeStyle = 'rgba(246,224,154,.35)'; cx.stroke();
    if (b.glow) { // 光の筋が流れる
      cx.save(); bevel(x, y, w, h, c); cx.clip();
      const sx = x - 60 + ((t * 140) % (w + 200));
      const sg = cx.createLinearGradient(sx, 0, sx + 50, 0); sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(0.5, 'rgba(255,240,200,.28)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
      cx.fillStyle = sg; cx.beginPath(); cx.moveTo(sx, y); cx.lineTo(sx + 50, y); cx.lineTo(sx + 30, y + h); cx.lineTo(sx - 20, y + h); cx.fill();
      cx.restore();
    }
  } else if (kind === 'ghost') {
    bevel(x, y, w, h, c); cx.fillStyle = p ? 'rgba(212,175,55,.18)' : 'rgba(0,0,0,.35)'; cx.fill();
    cx.lineWidth = 1; cx.strokeStyle = 'rgba(212,175,55,.45)'; cx.stroke();
  } else { // dark glass
    const g = cx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, p ? '#1b1b22' : '#18181f'); g.addColorStop(1, '#0a0a0e');
    bevel(x, y, w, h, c); cx.fillStyle = g; cx.fill();
    cx.lineWidth = 1.2; cx.strokeStyle = p ? GOLD2 : 'rgba(212,175,55,.7)'; cx.stroke();
  }
  cx.restore();
  const tc = b.tc || (kind === 'primary' ? '#fff' : kind === 'ghost' ? '#d9cfae' : GOLD2);
  if (b.sub && h >= 44) {
    text(b.label, x + w / 2, y + h / 2 - 7, b.size || 18, tc);
    spaced(b.sub, x + w / 2, y + h / 2 + 13, 8, kind === 'primary' ? GOLD2 : GOLD, 2.5);
  } else if (b.label) text(b.label, x + w / 2, y + h / 2 + 1, b.size || 18, tc);
}
// 各シーンで使い回せるボタン処理
const BtnMix = {
  down(x, y) { for (const b of this.btns || []) if (hit(b, x, y)) { b._p = true; this._pb = b; } },
  up(x, y) {
    const b = this._pb; this._pb = null;
    for (const bb of this.btns || []) bb._p = false;
    if (b && hit(b, x, y)) { SFX.click(); b.onTap(); }
  },
};

// ---------------------------------------------------------------- particles
let parts = [];
let shake = 0;
function burst(x, y, col, n = 12, sp = 160, life = 0.6, size = 3) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = sp * (0.3 + Math.random() * 0.7);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life, max: life, col: Array.isArray(col) ? pick(col) : col, size: size * (0.6 + Math.random() * 0.8), g: 300 });
  }
}
function floatText(s, x, y, col = '#fff', sz = 18) {
  parts.push({ x, y, vx: 0, vy: -50, life: 0.9, max: 0.9, txt: s, col, size: sz, g: 0 });
}
function updateParts(dt) {
  for (const p of parts) { p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter(p => p.life > 0);
  shake = Math.max(0, shake - dt * 30);
}
function drawParts() {
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1);
    if (p.txt) { cx.globalAlpha = a; textO(p.txt, p.x, p.y, p.size, p.col, '#000', 4); cx.globalAlpha = 1; }
    else { cx.globalAlpha = a; cx.fillStyle = p.col; cx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); cx.globalAlpha = 1; }
  }
}

// ---------------------------------------------------------------- backdrop
const stars = [...Array(80)].map(() => ({ x: Math.random() * W, y: Math.random() * H * 0.7, r: Math.random() * 1.4 + 0.3, p: Math.random() * 6 }));
const snow = [...Array(70)].map(() => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2 + 0.6, v: Math.random() * 25 + 18, p: Math.random() * 6 }));
const dust = [...Array(46)].map(() => ({ x: Math.random() * W, y: Math.random() * H, v: rand(5, 16), r: rand(0.5, 1.7), p: rand(0, 6) }));
const skyline = (() => { const a = []; let x = -10; while (x < W + 10) { const w = ri(22, 46), h = ri(40, 130); a.push({ x, w, h, win: [...Array(12)].map(() => Math.random() < 0.18), ant: Math.random() < 0.25 }); x += w + ri(0, 4); } return a; })();
let gT = 0;
function drawNight(top = '#060a1c', bot = '#1a1240') {
  const g = cx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, top); g.addColorStop(1, bot);
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  for (const s of stars) { cx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(gT * 1.5 + s.p)); cx.fillStyle = '#fff'; cx.fillRect(s.x, s.y, s.r, s.r); }
  cx.globalAlpha = 1;
}
function drawSnow(dt, alpha = 0.8) {
  cx.fillStyle = '#fff';
  for (const s of snow) {
    s.y += s.v * dt; s.x += Math.sin(gT + s.p) * 12 * dt;
    if (s.y > H + 4) { s.y = -4; s.x = Math.random() * W; }
    cx.globalAlpha = alpha * (s.r / 2.6); cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 7); cx.fill();
  }
  cx.globalAlpha = 1;
}
// 秘密基地の背景: 漆黒 + 深紅の光 + 細い格子 + 金の粒子
function drawAgency(dt, glowY = 230) {
  cx.fillStyle = INK; cx.fillRect(0, 0, W, H);
  const g = cx.createRadialGradient(W / 2, glowY, 10, W / 2, glowY, 380);

function Procure(api) {

  const nt = () => Math.floor(Math.random() * T.length);

    let t; do { t = nt(); } while ((c >= 2 && g[r][c - 1].t === t && g[r][c - 2].t === t) || (r >= 2 && g[r - 1][c].t === t && g[r - 2][c].t === t));
    g[r][c] = { t, ox: 0, oy: -(R - r) * S - 200 * Math.random(), sc: 1 };

      if (c < C && g[r][c] && g[r][c - 1] && g[r][c].t === g[r][c - 1].t) run++;
      else { if (run >= 3) for (let k = c - run; k < c; k++) m.add(r * C + k); run = 1; }
    } }

      if (r < R && g[r][c] && g[r - 1][c] && g[r][c].t === g[r - 1][c].t) run++;
      else { if (run >= 3) for (let k = r - run; k < r; k++) m.add(k * C + c); run = 1; }
    } }

  }
  function lineAt(r, c) {
    const t = g[r][c].t; let h = 1, v = 1;
    for (let k = c - 1; k >= 0 && g[r][k].t === t; k--) h++;
    for (let k = c + 1; k < C && g[r][k].t === t; k++) h++;
    for (let k = r - 1; k >= 0 && g[k][c].t === t; k--) v++;

    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const r2 = r + dr, c2 = c + dc; if (r2 >= R || c2 >= C) continue;
      [g[r][c], g[r2][c2]] = [g[r2][c2], g[r][c]];
      const ok = lineAt(r, c) || lineAt(r2, c2);

// タイプライター付き文章パネル（長い文章はページ送り）
function typeScene(cfg) {
  return {
    ...BtnMix,
    enter(arg) {
      this.cfg = typeof cfg === 'function' ? cfg(arg) : cfg; this.t = 0; this.n = 0;
      const top = this.cfg.top || 196, bot = this.cfg.bottom || 545;
      const all = wrapLines(this.cfg.body, W - 70, 14.5);
      const maxL = Math.floor((bot - top - 26) / 23);
      this.pages = [];
      let cur = [];
      for (let i = 0; i < all.length; i++) {
        const l = all[i];
        if (!cur.length && l === '') continue;
        cur.push(l);
        // 次の段落が収まらないなら空行で改ページ
        if (l === '' && cur.length > 1) {
          let j = i + 1; while (j < all.length && all[j] !== '') j++;
          if (cur.length + (j - i - 1) > maxL) { cur.pop(); this.pages.push(cur); cur = []; continue; }
        }
        if (cur.length >= maxL) { this.pages.push(cur); cur = []; }
      }
      if (cur.length) this.pages.push(cur);
      this.pg = 0; this.setPage();
      this.btns = [Btn(52, 560, 256, 58, this.cfg.btn, () => {
        if (this.n < this.total) { this.n = this.total; return; }
        if (this.pg < this.pages.length - 1) { this.pg++; this.setPage(); return; }
        this.cfg.next();
      }, { glow: true, size: 19, sub: this.cfg.sub })];
    },
    setPage() { this.lines = this.pages[this.pg]; this.total = this.lines.join('').length; this.n = 0; },
    update(dt) {
      this.t += dt;
      const prev = Math.floor(this.n);
      if (this.n < this.total) { this.n = Math.min(this.total, this.n + dt * 40); if (Math.floor(this.n) !== prev && Math.floor(this.n) % 2) SFX.type(); }
    },
    draw(dt) {
      drawAgency(dt, 120);
      this.cfg.head(this.t, this.n < this.total);
      const top = this.cfg.top || 196, bot = this.cfg.bottom || 545;
      drawPanel(14, top, W - 28, bot - top);
      let left = Math.floor(this.n), y = top + 24;
      for (const l of this.lines) {
        const s = l.slice(0, Math.max(0, left)); left -= l.length;
        if (l.startsWith('【')) { cx.fillStyle = 'rgba(179,18,46,.35)'; if (s) cx.fillRect(28, y - 10, 4, 20); text(s, 38, y, 14, GOLD2, 'left'); }
        else if (s.startsWith('・')) { text('▸', 30, y, 11, CRIM, 'left'); text(s.slice(1), 44, y, 13.5, '#e2dccb', 'left', 'normal'); }
        else text(s, 30, y, 14.5, '#ece6d6', 'left', 'normal');
        y += 23;
        if (left < 0) { if (Math.floor(this.t * 4) % 2) { cx.fillStyle = GOLD; font(14.5, 'normal'); cx.fillRect(30 + cx.measureText(s).width + 2, y - 31, 7, 14); } break; }
      }
      if (this.pages.length > 1) mono(`${this.pg + 1} / ${this.pages.length}`, W - 30, bot - 14, 9, GOLD, 'right');
      const more = this.pg < this.pages.length - 1;
      for (const b of this.btns) {
        b.label = this.n < this.total ? 'スキップ' : more ? '次へ' : this.cfg.btn;
        b.sub = this.n < this.total ? 'SKIP' : more ? 'NEXT PAGE' : this.cfg.sub;
        drawBtn(b, this.t);
      }
    },
    down(x, y) { BtnMix.down.call(this, x, y); if (!this._pb && this.n < this.total) this.n = this.total; },
  };
}

  },
  down(x, y, id) { if (this.cd > 0 || this.done) return; this.g.down && this.g.down(x, y, id); },
  move(x, y, id, d) { if (this.cd > 0 || this.done) return; this.g.move && this.g.move(x, y, id, d); },

const COMMENTS = {
  S: ['完璧だ。君は伝説になる。', '非の打ち所がない仕事ぶりだ。'],
  A: ['見事な手際だ。', '優秀だ。この調子で頼む。'],
  B: ['悪くない。だが、まだやれるはずだ。', '及第点だ。次で取り返せ。'],
  C: ['危なかったな…気を引き締めろ。', 'ギリギリだ。子供たちの夢がかかっているぞ。'],
  D: ['これでは作戦に支障が出る…！', '厳しい結果だ。だが次がある。'],
};
function rateBar(x, y, w, h, r) {
  bevel(x, y, w, h, 4); cx.fillStyle = '#16161c'; cx.fill();
  if (r > 0) {
    cx.save(); bevel(x, y, w, h, 4); cx.clip();
    const g = cx.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, CRIM2); g.addColorStop(0.55, CRIM); g.addColorStop(1, GOLD2);
    cx.fillStyle = g; cx.fillRect(x, y, w * r, h); cx.restore();
  }
  cx.fillStyle = 'rgba(0,0,0,.6)'; for (let i = 1; i < 10; i++) cx.fillRect(x + w * i / 10, y, 1, h);
  bevel(x, y, w, h, 4); cx.strokeStyle = 'rgba(212,175,55,.5)'; cx.lineWidth = 1; cx.stroke();
}
function statRow(l, x0, x1, y) {
  const k = l.indexOf(': ');
  if (k < 0) { text(l, x0, y, 14, '#fff', 'left'); return; }
  const a = l.slice(0, k), b = l.slice(k + 2);
  text(a, x0, y, 13, '#a9a28c', 'left', 'normal');
  font(14); const bw = cx.measureText(b).width; font(13, 'normal'); const aw = cx.measureText(a).width;
  cx.fillStyle = 'rgba(212,175,55,.35)'; for (let x = x0 + aw + 8; x < x1 - bw - 8; x += 5) cx.fillRect(x, y + 4, 1.5, 1.5);
  text(b, x1, y, 14, '#fff', 'right');
}
const Result = {
  ...BtnMix,
  enter(a) {
    this.a = a; this.t = 0; this.shown = 0; this.g = gradeOf(a.rate); this.comment = pick(COMMENTS[this.g]); this.played = 0;
    const m = MISSIONS[a.i];
    const prev = save.missions[m.id] || 0;
    this.newBest = a.rate > prev; if (this.newBest) { save.missions[m.id] = a.rate; persist(); }
    if (G.mode === 'campaign') {
      G.results[a.i] = a.rate;
      const last = a.i === MISSIONS.length - 1;
      this.btns = [Btn(52, 560, 256, 58, last ? '最終評価へ' : '次の作戦へ', () => { if (last) go(Final); else go(Briefing, a.i + 1); }, { glow: true, size: 19, sub: last ? 'FINAL DEBRIEF' : 'NEXT OPERATION' })];
    } else {
      this.btns = [
        Btn(24, 560, 150, 56, 'もう一度', () => go(Briefing, a.i), { size: 17, sub: 'RETRY' }),
        Btn(186, 560, 150, 56, '訓練メニュー', () => go(Training), { kind: 'dark', size: 15, sub: 'TRAINING' }),

  },
  update(dt) {
    this.t += dt;

  },
  draw(dt) {
    drawAgency(dt, 240);

    goldRule(40, 24, W - 24);
    emo(m.icon, 52, 82, 30);
    serifText(m.name, 82, 76, 26, '#fff', 'left', '900');
    mono(`${m.genre}  //  ${m.date}`, 84, 102, 10, '#8f876f', 'left', 'normal');
    cx.save(); if (shake > 0) cx.translate(rand(-shake, shake) * 0.4, rand(-shake, shake) * 0.4);
    drawPanel(16, 128, W - 32, 414);
    spaced('ACHIEVEMENT RATE', 36, 156, 9, GOLD, 2, 'left');
    mono(`${(this.shown * 100).toFixed(1)}`, 36, 200, 50, '#fff', 'left');
    font(50); cx.font = `bold 50px ${MONO}`; const nw = cx.measureText(`${(this.shown * 100).toFixed(1)}`).width;
    mono('%', 40 + nw, 210, 20, GOLD2, 'left');
    rateBar(36, 240, W - 72, 14, this.shown);
    if (this.played) {
      const k = clamp((this.t - this.played) * 6, 0, 1), s = 2.2 - 1.2 * k;
      cx.globalAlpha = k; stamp(W - 76, 190, this.g, 'GRADE', gradeCol[this.g], s, -0.22, 38); cx.globalAlpha = 1;
      if (this.newBest && G.mode === 'training') spaced('★ PERSONAL BEST', W - 76, 240 - 16, 8, GOLD2, 1.5);
    }
    let y = 290;
    for (const l of this.a.lines) { statRow(l, 36, W - 36, y); y += 30; }
    if (this.played) {
      const k = clamp((this.t - this.played - 0.3) * 3, 0, 1); cx.globalAlpha = k;
      cx.fillStyle = 'rgba(179,18,46,.18)'; cx.fillRect(30, 432, W - 60, 96);
      cx.fillStyle = CRIM; cx.fillRect(30, 432, 3, 96);
      spaced('FROM THE DIRECTOR', 44, 450, 8.5, GOLD, 2, 'left');
      const ls = wrapLines(`「${this.comment}」`, W - 100, 15);
      ls.forEach((l, i) => serifText(l, 44, 478 + i * 24, 15, '#f3ecd8', 'left'));
      cx.globalAlpha = 1;

    cx.restore();

  down(x, y) { if (!this.played) { this.shown = this.a.rate; return; } BtnMix.down.call(this, x, y); },

const RANKS = [
  { min: 95, r: 'S', title: '伝説のサンタクロース', msg: '世界中の子供たちが、最高の笑顔で朝を迎えた。君の名は、結社の歴史に永遠に刻まれるだろう。来年は君が長官だ。' },
  { min: 85, r: 'A', title: '筆頭エージェント', msg: 'ほぼ完璧な作戦だった。子供たちの歓声が北極まで届いている。今夜はゆっくりココアでも飲んでくれ。' },
  { min: 70, r: 'B', title: '一人前のエージェント', msg: '作戦は成功だ。いくつか取りこぼしはあったが、多くの子供たちが喜んでいる。来年はさらに上を目指せ。' },
  { min: 50, r: 'C', title: '見習いエージェント', msg: 'なんとか夜は明けた…。プレゼントが届かなかった家もある。トナカイたちと共に、一から鍛え直しだ。' },
  { min: 0, r: 'D', title: '石炭係', msg: 'これは…惨敗だ。K.R.A.M.P.U.S. の高笑いが聞こえる。君には来年、石炭の配達から始めてもらう。' },
];
const Final = {
  ...BtnMix,
  enter() {
    this.t = 0;
    const rs = MISSIONS.map((m, i) => G.results[i] || 0);
    this.total = rs.reduce((a, b) => a + b, 0) / rs.length * 100;
    this.rank = RANKS.find(r => this.total >= r.min);
    this.kids = Math.round(this.total / 100 * 2200000000);
    this.newBest = this.total > save.best;
    if (this.newBest) { save.best = this.total; save.bestRank = this.rank.r; persist(); }
    this.btns = [
      Btn(24, 574, 150, 52, 'もう一度挑戦', () => { G.mode = 'campaign'; G.results = []; G.codename = pick(CODENAMES); go(Prologue); }, { size: 15, sub: 'NEW OPERATION' }),
      Btn(186, 574, 150, 52, 'タイトルへ', () => go(Title), { kind: 'dark', size: 15, sub: 'HEADQUARTERS' }),
    ];
    this.played = false;
  },
  update(dt) {
    this.t += dt;
    if (!this.played && this.t > 2.6) {
      this.played = true; SFX.stamp(); shake = 8;
      setTimeout(() => { if (this.total >= 70) SFX.fanfare(); else SFX.sad(); }, 300);
      if (this.total >= 85) for (let i = 0; i < 4; i++) setTimeout(() => burst(rand(60, 300), rand(100, 260), [GOLD, GOLD2, '#fff', CRIM], 40, 260, 1.2, 3), 300 + i * 300);
    }
  },
  draw(dt) {
    drawAgency(dt, 380);
    // 夜明けの光
    const dg = cx.createRadialGradient(W / 2, H + 60, 10, W / 2, H + 60, 340); dg.addColorStop(0, 'rgba(255,190,110,.28)'); dg.addColorStop(1, 'rgba(255,190,110,0)');
    cx.fillStyle = dg; cx.fillRect(0, 0, W, H);
    drawSnow(dt, 0.4);
    spaced('DEC 25  ·  05:00  ·  FINAL REPORT', W / 2, 22, 9, '#b9ad8c', 2);
    cx.save(); cx.shadowColor = 'rgba(200,20,50,.8)'; cx.shadowBlur = 14;
    spaced('MISSION COMPLETE', W / 2, 54, 24, goldGrad(42, 66), 2.5, 'center', SERIF, '900');
    cx.restore();
    cx.save(); if (shake > 0) cx.translate(rand(-shake, shake) * 0.4, rand(-shake, shake) * 0.4);
    drawPanel(14, 78, W - 28, 226);
    MISSIONS.forEach((m, i) => {
      const r = G.results[i] || 0, y = 102 + i * 34;
      const k = clamp((this.t - i * 0.25) * 2, 0, 1);
      cx.globalAlpha = k;
      mono(m.code.replace('OP-', ''), 34, y, 10, GOLD, 'center');
      text(m.name, 50, y, 13, '#ece6d6', 'left');
      rateBar(150, y - 5, 118, 10, r * k);
      mono(`${Math.round(r * 100 * k)}%`, 310, y, 12, '#fff', 'right');
      serifText(gradeOf(r), 328, y, 15, gradeCol[gradeOf(r)], 'center', '900');
      cx.globalAlpha = 1;
    });
    const k2 = clamp((this.t - 1.6) / 1.0, 0, 1);
    spaced('TOTAL ACHIEVEMENT', 30, 326, 9, GOLD, 2, 'left');
    mono(`${(this.total * k2).toFixed(1)}%`, 30, 364, 46, '#fff', 'left');
    if (this.t > 2.6) {
      const k = clamp((this.t - 2.6) * 6, 0, 1);
      cx.globalAlpha = k; stamp(W - 66, 352, this.rank.r, 'RANK', gradeCol[this.rank.r], 2.2 - 1.2 * k, -0.2, 40); cx.globalAlpha = 1;
      if (this.newBest) spaced('★ NEW RECORD', 30, 394, 9, GOLD2, 2, 'left');
      const k3 = clamp((this.t - 2.9) * 3, 0, 1); cx.globalAlpha = k3;
      goldRule(410, 30, W - 30);

      serifText(this.rank.title, W / 2, 446, 21, gradeCol[this.rank.r], 'center', '900');
      text(`笑顔になった子供たち　約 ${(this.kids / 1e8).toFixed(1)} 億人`, W / 2, 472, 12, '#f0d9a8');
      cx.fillStyle = 'rgba(0,0,0,.45)'; cx.fillRect(22, 486, W - 44, 80); cx.fillStyle = CRIM; cx.fillRect(22, 486, 3, 80);
      const ls = wrapLines(this.rank.msg, W - 72, 12.5);
      ls.slice(0, 4).forEach((l, i) => text(l, 34, 501 + i * 18, 12.5, '#ece6d6', 'left', 'normal'));
      cx.globalAlpha = 1;
    }
    cx.restore();
    if (this.t > 3.1) for (const b of this.btns) drawBtn(b, this.t);
    drawParts();
  },
  down(x, y) { if (this.t < 3.1) { this.t = 3.1; return; } BtnMix.down.call(this, x, y); },

// =====================================================================
//  MAIN LOOP
// =====================================================================
go(Title);
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; gT += dt;
  cx.setTransform(scale * DPR, 0, 0, scale * DPR, 0, 0);
  scene.update(dt);
  updateParts(dt);
  scene.draw(dt);
  postFX();
  if (fade > 0) { // シャッター風の場面転換
    const e = fade * fade, bh = H / 2 * e;
    cx.fillStyle = INK; cx.fillRect(0, 0, W, bh); cx.fillRect(0, H - bh, W, bh);
    cx.fillStyle = GOLD; cx.fillRect(0, bh - 1, W, 1); cx.fillRect(0, H - bh, W, 1);
    fade = Math.max(0, fade - dt * 3.2);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// テスト用フック
window.__santa = { go, scenes: { Title, Prologue, Briefing, Play, Result, Final, Training }, G, MISSIONS };
</script>
