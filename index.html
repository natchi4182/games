<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>games</title>
  <style>
    body { margin: 0; min-height: 100vh; font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
      background: repeating-linear-gradient(45deg, #ffe7b8 0 18px, #ffdfa3 18px 36px); color: #4a3426; }
    main { max-width: 480px; margin: 0 auto; padding: 32px 16px; }
    h1 { text-align: center; font-size: 32px; }
    a.card { display: flex; gap: 14px; align-items: center; background: #fff; border-radius: 20px; padding: 16px;
      text-decoration: none; color: inherit; box-shadow: 0 6px 0 rgba(0,0,0,.15); margin-bottom: 16px; }
    a.card:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.15); }
    .ico { font-size: 40px; }
    b { display: block; font-size: 18px; }
    small { opacity: .7; }
  </style>
</head>
<body>
  <main>
    <h1>🎮 games</h1>
    <a class="card" href="chibi-hammers-ar/">
      <span class="ico">🔨</span>
      <span><b>ちびハンマーズ AR</b><small>景色を撮って、荒地と廃墟をハンマーで整地しよう</small></span>
    </a>
  </main>
</body>
</html>
