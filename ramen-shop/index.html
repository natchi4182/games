<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18223a">
<meta name="description" content="修行から始めて、伝説のラーメン屋を目指す経営シミュレーション。無料でブラウザから遊べます。">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>らーめん開業日誌</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 藍染めの夜の店内（左：店の断面図）＋ 檜の帳場（右：操作盤）。一つの世界観に固定したシングルテーマ。 */
:root{
  color-scheme: dark;
  --ai:#18223a;        /* 藍：地 */
  --ai-deep:#0f1628;
  --ai-line:#2c3a5c;
  --hinoki:#efe1bf;    /* 檜：帳場の紙面 */
  --hinoki-2:#e3d1a6;
  --sumi:#2b2118;      /* 墨：帳場の文字 */
  --sumi-soft:#6d5a45;
  --tamago:#f0a93a;    /* 味玉：アクセント */
  --tamago-ink:#5a3404;
  --noren:#f4efe4;
  --good:#2f7d4f;
  --warn:#b8741a;
  --bad:#b23a2e;
  --font-disp:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --font-led:"DotGothic16","Osaka-Mono","MS Gothic",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
table{color:inherit;font:inherit}
html,body{height:100%}
body{background:var(--ai);color:var(--noren);font-family:var(--font-body);font-size:14px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tamago);outline-offset:2px}

.app{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:10px 14px;background:var(--ai-deep);border:1px solid var(--ai-line);border-radius:6px}
.brand{font-family:var(--font-disp);font-size:20px;letter-spacing:.04em;color:var(--noren);margin-right:auto;display:flex;align-items:baseline;gap:10px;min-width:0}
.brand small{font-family:var(--font-body);font-size:12px;color:#9aa7c4;letter-spacing:.08em}
.stat{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.stat .k{font-size:10.5px;color:#9aa7c4;letter-spacing:.12em}
.stat .v{font-family:var(--font-led);font-size:17px;font-variant-numeric:tabular-nums;color:var(--noren);white-space:nowrap}
.v.neg{color:#ff8f80}
.meter{width:70px;height:6px;background:#2a3554;border-radius:3px;overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--tamago)}
.meter i.hot{background:#e0604f}

.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:920px){.grid{grid-template-columns:minmax(0,1fr)}}

.stage{display:flex;flex-direction:column;gap:10px;min-width:0}
.canvas-wrap{position:relative;border-radius:6px;overflow:hidden;border:1px solid var(--ai-line);background:#0b1020}
canvas{display:block;width:100%;height:auto}
.live{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--ai-line);border:1px solid var(--ai-line);border-radius:6px;overflow:hidden}
@media (max-width:560px){.live{grid-template-columns:repeat(3,minmax(0,1fr))}}
.live div{background:var(--ai-deep);padding:8px 10px;min-width:0}
.live .k{font-size:10.5px;color:#9aa7c4;letter-spacing:.1em;display:block}
.live .v{font-family:var(--font-led);font-size:18px;font-variant-numeric:tabular-nums}
.log{list-style:none;margin:0;padding:8px 12px;height:150px;overflow-y:auto;background:var(--ai-deep);border:1px solid var(--ai-line);border-radius:6px;font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.log li{display:flex;gap:10px;color:#c9d2e6}
.log time{font-family:var(--font-led);color:#7f8db0;flex:none}
.log li.bad{color:#ffb4a8}.log li.good{color:#a8e0b9}.log li.info{color:var(--tamago)}

/* 帳場パネル */
.panel{background:var(--hinoki);color:var(--sumi);border-radius:6px;min-width:0;box-shadow:0 0 0 1px #c9b385 inset;display:flex;flex-direction:column}
.panel h2{font-family:var(--font-disp);font-weight:400;font-size:20px;margin:0;letter-spacing:.03em;text-wrap:balance}
.panel h3{font-size:13px;margin:0 0 6px;letter-spacing:.1em;color:var(--sumi-soft);font-weight:700}
.phead{padding:14px 16px 10px;border-bottom:1px solid #d4bf91;display:flex;flex-direction:column;gap:2px}
.phead p{margin:0;color:var(--sumi-soft);font-size:12.5px}
.tabs{display:flex;border-bottom:1px solid #d4bf91;overflow-x:auto}
.tabs button{flex:1;background:none;border:0;padding:9px 6px;cursor:pointer;font-weight:700;color:var(--sumi-soft);border-bottom:3px solid transparent;white-space:nowrap;font-size:13px}
.tabs button[aria-selected="true"]{color:var(--sumi);border-bottom-color:var(--tamago)}
.pbody{padding:14px 16px;display:flex;flex-direction:column;gap:16px}
.pfoot{padding:12px 16px 16px;border-top:1px solid #d4bf91;display:flex;gap:8px;flex-wrap:wrap}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.row label,.row .lbl{font-weight:500}
.hint{font-size:12px;color:var(--sumi-soft);margin:0}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid #c4ad7c;background:var(--hinoki);padding:5px 10px;border-radius:4px;cursor:pointer;font-size:12.5px;color:var(--sumi)}
.seg button[aria-pressed="true"]{background:var(--sumi);color:var(--hinoki);border-color:var(--sumi)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:30px;height:30px;border-radius:4px;border:1px solid #c4ad7c;background:#f7edd4;cursor:pointer;font-weight:700;color:var(--sumi)}
.stepper output{min-width:46px;text-align:center;font-family:var(--font-led);font-size:17px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--sumi)}
.price-big{font-family:var(--font-led);font-size:26px;font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer}
.chk input{accent-color:var(--sumi);width:16px;height:16px}

.ledger{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
.ledger td{padding:4px 0;border-bottom:1px dotted #c9b385}
.ledger td:last-child{text-align:right;font-family:var(--font-led);font-size:14px}
.ledger tr.sum td{border-bottom:0;border-top:2px solid var(--sumi);font-weight:700;padding-top:6px}
.ledger .neg{color:var(--bad)} .ledger .pos{color:var(--good)}
.ledger .sub td{color:var(--sumi-soft);font-size:12px}

.btn{border:0;border-radius:5px;padding:10px 16px;cursor:pointer;font-weight:700;letter-spacing:.04em}
.btn.primary{background:var(--sumi);color:var(--hinoki);flex:1}
.btn.primary:hover{background:#45362a}
.btn.ghost{background:transparent;border:1px solid #b9a271;color:var(--sumi)}
.btn.accent{background:var(--tamago);color:var(--tamago-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.costbox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.costbox div{background:#f7edd4;border:1px solid #d9c497;border-radius:4px;padding:6px 8px;min-width:0}
.costbox .k{font-size:11px;color:var(--sumi-soft);display:block}
.costbox .v{font-family:var(--font-led);font-size:16px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:700}
.pill.good{background:#d6ecd9;color:#1d5a34}.pill.warn{background:#f6e0b8;color:#7a4a08}.pill.bad{background:#f4cfc8;color:#82231a}

.reviews{display:flex;flex-direction:column;gap:8px}
.review{background:#f7edd4;border-left:3px solid #c4ad7c;padding:6px 10px;font-size:13px}
.review .stars{color:#a8650b;letter-spacing:1px;font-size:12px}
.chart{width:100%;height:auto;display:block}
.invest{display:flex;flex-direction:column;gap:8px}
.invest .item{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#f7edd4;border:1px solid #d9c497;border-radius:4px;padding:8px 10px}
.invest .item div{min-width:0}
.invest .item b{display:block}
.invest .item span{font-size:12px;color:var(--sumi-soft)}
.invest .item>.btn,.btns .btn{white-space:nowrap;flex:none}

.speed{display:flex;gap:4px}
.speed button{flex:1}

/* モーダル */
.modal{position:fixed;inset:0;background:rgba(6,10,20,.72);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:10}
.card{background:var(--hinoki);color:var(--sumi);border-radius:8px;max-width:560px;width:100%;max-height:100%;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card .chead{background:var(--ai-deep);color:var(--noren);padding:16px 20px;border-radius:8px 8px 0 0}
.card .chead h2{font-family:var(--font-disp);font-weight:400;margin:0;font-size:22px;text-wrap:balance}
.card .chead p{margin:4px 0 0;color:#a9b5cf;font-size:13px}
.card .cbody{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.card .cfoot{padding:0 20px 18px;display:flex;gap:8px;flex-wrap:wrap}
.opt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:480px){.opt{grid-template-columns:minmax(0,1fr)}}
.opt button{text-align:left;background:#f7edd4;border:1px solid #d1bb8b;border-radius:5px;padding:10px 12px;cursor:pointer;color:var(--sumi);display:flex;flex-direction:column;gap:2px;min-width:0}
.opt button b{font-size:15px}
.opt button span{font-size:12px;color:var(--sumi-soft);line-height:1.45}
.opt button[aria-pressed="true"]{border:2px solid var(--sumi);background:#fff7e3;padding:9px 11px}
.textin{width:100%;padding:8px 10px;border:1px solid #c4ad7c;border-radius:4px;background:#fffaf0;font:inherit;color:var(--sumi)}


.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ladder>li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:5px;background:#f7edd4;border:1px solid #d9c497;opacity:.6}
.ladder>li.done{opacity:.85}.ladder>li.cur{opacity:1;border:2px solid var(--sumi);background:#fff7e3;padding:7px 9px}
.ladder .sn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sumi);color:var(--hinoki);display:grid;place-items:center;font-size:12px;font-weight:700}
.ladder>li.done .sn{background:var(--good)}
.ladder>li>div{min-width:0;display:flex;flex-direction:column}
.ladder>li span{font-size:12px;color:var(--sumi-soft)}
.ladder ul{list-style:none;margin:6px 0 0;padding:0;font-size:12.5px}
.ladder ul li{color:var(--sumi-soft)}.ladder ul li.ok{color:var(--good);font-weight:700}
.diag{background:var(--ai-deep);color:var(--noren);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.diag-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lead{margin:0;font-size:14px}.lead b{font-family:var(--font-disp);font-weight:400;font-size:21px;letter-spacing:.02em;margin:0 2px}
.diag .lead b{color:var(--tamago)}
.grade{flex:none;width:58px;height:58px;border-radius:50%;border:3px solid var(--tamago);display:grid;place-items:center;font-family:var(--font-disp);font-size:30px;color:var(--tamago)}
.diag .q{margin:0;padding-top:8px;border-top:1px dashed #3a4a70;color:#cfd8ec}
.diag .q strong{color:var(--noren);font-size:16px}
.axes{display:flex;flex-direction:column;gap:6px}
.ax{display:grid;grid-template-columns:6.5em minmax(0,1fr) 2.5em;gap:8px;align-items:center;font-size:13px}
.axbar{height:10px;background:#e3d1a6;border-radius:5px;overflow:hidden}
.axbar i{display:block;height:100%;background:var(--sumi)}.axbar i.low{background:var(--bad)}.axbar i.high{background:var(--good)}
.axv{font-family:var(--font-led);text-align:right;font-variant-numeric:tabular-nums}
.diag-mini{background:#f7edd4;border:1px solid #d1bb8b;border-radius:6px;padding:10px 12px}
.diag-mini p{margin:0}.diag-mini p+p{margin-top:6px;font-size:13px}
.diag-mini .gr{margin-left:8px;font-size:12px;font-weight:700;color:var(--sumi-soft)}

.oyakata{background:#fff7e3;border:1px solid #d1bb8b;border-left:4px solid var(--ai);border-radius:5px;margin:12px 16px 0;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.oyakata.off{background:none;border:0;padding:0;align-items:flex-start}
.oyakata p{margin:0;font-size:13px}
.oy-head{display:flex;justify-content:space-between;align-items:center}
.oy-head b{font-family:var(--font-disp);font-weight:400;font-size:14px;color:var(--ai)}
.oy-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;padding-top:6px;border-top:1px dashed #d1bb8b;font-size:13px}
.oy-foot b{font-family:var(--font-led);font-size:16px}
.linkbtn{background:none;border:0;color:var(--sumi-soft);text-decoration:underline;cursor:pointer;font-size:12px}
.focus{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--sumi-soft)}
.focusbar{position:relative;flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--good),#d9c497 50%,var(--warn))}
.focusbar i{position:absolute;top:-4px;width:4px;height:16px;margin-left:-2px;background:var(--sumi);border-radius:2px}
.invest .item.on{border-color:var(--good)}
.btns{display:flex;flex-direction:column;gap:4px;flex:none}
.trfoot .btn{flex:1 1 auto}
.talents{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (max-width:480px){.talents{grid-template-columns:minmax(0,1fr)}}
.tal{background:#f7edd4;border:1px dashed #c9b385;border-radius:5px;padding:6px 8px;display:flex;flex-direction:column;min-width:0;opacity:.75}
.tal.ok{border:1px solid var(--good);background:#eef6ea;opacity:1}
.hints p{margin:4px 0 0;font-size:12.5px;color:var(--ai);font-style:italic}
.tal b{font-size:13px}.tal span{font-size:11.5px;color:var(--sumi-soft)}.tal .cond{font-size:11px}

.site-foot{text-align:center;font-size:12px;padding:8px 0}.site-foot a{color:#9aa7c4}
.adcard .adbox{border:2px dashed #b9a271;border-radius:6px;padding:28px 16px;text-align:center;display:flex;flex-direction:column;gap:6px;background:#f7edd4}
.adcard .adbox span{font-size:12px;color:var(--sumi-soft)}
.tut{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px}
.tut li b{display:block}.tut li span{font-size:13px;color:var(--sumi-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="bar" id="bar"></header>
  <main class="grid">
    <section class="stage">
      <div class="canvas-wrap"><canvas id="cv" width="720" height="320" aria-label="店内の様子"></canvas></div>
      <div class="live" id="live"></div>
      <ol class="log" id="log" aria-live="polite"></ol>
    </section>
    <aside class="panel" id="panel"></aside>
  </main>
</div>
<div class="modal" id="modal" hidden></div>

<script>
(()=>{
'use strict';
// ───────── 基本データ ─────────
const LOC={
  shotengai:{name:'下町の商店街',rent:180000,base:150,seats:10,priceTol:1.0,dow:[1.15,0.95,0.9,0.95,1.0,1.05,1.2],desc:'家賃は安く地元客が中心。昼に強く深夜は静か。',curve:{11:1.0,12:2.2,13:1.6,14:.7,15:.4,16:.4,17:.6,18:1.1,19:1.4,20:1.0,21:.5,22:.25,23:.12,24:.05,25:.02}},

};
const GRADES=[{name:'標準',mult:1,taste:0,prem:0},{name:'一工夫',mult:1.35,taste:5,prem:40},{name:'こだわり',mult:1.7,taste:9,prem:80},{name:'極上',mult:2.15,taste:13,prem:140},{name:'極み',mult:2.6,taste:16,prem:200}];
const NOODLES=[{name:'製麺所・標準',cost:38,taste:0,prem:0},{name:'製麺所・中級',cost:48,taste:3,prem:20},{name:'製麺所・特注',cost:58,taste:5,prem:40},{name:'自家製麺',cost:22,taste:7,prem:60,needs:'machine'},{name:'自家製・国産小麦',cost:40,taste:10,prem:90,needs:'machine'}];
// 良い材料を仕入れるのに必要な人脈（業者・農家・精肉店との付き合い）
const GREQ=[0,0,1,3,5], NREQ=[0,0,2,0,4], CREQ=[0,0,1,3,5];
// 良い材料を活かすのに必要な腕前。届かないうちは味の上乗せが最低4割まで落ちる（原価とお客の期待はそのまま）
const GSK=[0,2,4,6,9], NSK=[0,1,3,4,7], CSK=[0,1,2,5,8];
const skillEff=req=>req?clamp(.4+.6*(S.skill||0)/req,.4,1):1;
const isHomeNoodle=i=>!!(NOODLES[i]&&NOODLES[i].needs);
const CHASHU=[{name:'バラ巻き2枚',cost:62,taste:0,prem:0},{name:'肩ロース2枚',cost:85,taste:2,prem:20},{name:'肩ロース厚切り3枚',cost:125,taste:5,prem:60},{name:'低温調理と炙りの2種盛り',cost:155,taste:7,prem:90},{name:'銘柄豚の極み盛り',cost:200,taste:9,prem:130}];
const TOPPING=34; // ネギ・メンマ・海苔
const SIDES={ajitama:{name:'味玉',price:120,cost:35,rate:.34},rice:{name:'ライス',price:150,cost:24,rate:.28},gyoza:{name:'餃子',price:350,cost:88,rate:.24}};
const HOURS={lunch:{name:'昼のみ 11–15時',iv:[[11,15]]},split:{name:'昼夜 11–15・18–22時',iv:[[11,15],[18,22]]},full:{name:'通し 11–21時',iv:[[11,21]]},night:{name:'夜型 17–翌2時',iv:[[17,26]]}};
const MONTH_T=[5.4,6.1,9.4,14.3,18.8,21.9,25.7,26.9,23.3,18.0,12.5,7.7];
const MONTH_RAIN=[.15,.2,.3,.3,.33,.45,.38,.3,.42,.33,.25,.15];
const DOW='日月火水木金土';
const OWNER=300000, WAGE_BASE=1150, LOAN_PAY=125000, LEASE=18000, START_CASH=2500000, LOAN=7000000;
const START_DATE=new Date(2026,3,1);
const SAVE_KEY='ramen-kaigyo-v1';

// ───────── ユーティリティ ─────────
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const poisson=l=>{if(l<=0)return 0;let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1};
const yen=n=>(n<0?'−¥':'¥')+Math.abs(Math.round(n)).toLocaleString('ja-JP');
const man=n=>{const a=Math.abs(n);const s=n<0?'−':'';return a>=10000?s+(a/10000).toFixed(a>=1e6?0:1)+'万円':s+Math.round(a).toLocaleString('ja-JP')+'円'};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dateOf=d=>{const x=new Date(START_DATE);x.setDate(x.getDate()+d);return x};
const fmtDate=d=>{const x=dateOf(d);return `${x.getMonth()+1}月${x.getDate()}日(${DOW[x.getDay()]})`};
const hm=m=>{const h=Math.floor(m/60),mm=Math.floor(m%60);return `${h>=24?h-24:h}:${String(mm).padStart(2,'0')}`};
const stars=r=>'★'.repeat(Math.round(r))+'☆'.repeat(5-Math.round(r));

// ───────── 状態 ─────────
let S=null;     // 永続する店の状態
let D=null;     // 当日の営業シミュレーション
let tab='prep';
let speed=1, paused=false;

function newGame(name,loc,style,diff='real'){
  S={v:2,name,loc,style,diff,day:0,cash:diff==='easy'?4000000:START_CASH,
    stars:[],rTotal:0,reviews:[],awareness:.42,buzz:[],competitor:0,skill:0,fatigue:10,
    market:{pork:1,wheat:1},wage:WAGE_BASE,
    menu:{price:STYLES[style].exp,grade:0,noodle:0,chashu:0,ajitama:true,rice:!STYLES[style].riceFree,gyoza:false},

    weather:null,tomorrow:null,event:null,phase:'morning',lastReport:null,totalProfit:0,expBoost:0,tempStaff:0,potHalf:false,sick:false,size:0,loans:[{name:'開業資金',left:LOAN,pay:LOAN_PAY}],branches:[],nextBr:1,brToday:[],stage:0,stageDay:{},media:false,streak42:0,bestMonthCust:0,relocated:false,closedUntil:-1,critic:null,criticNext:0,legend:false,guide:true,dev:{},menuOn:[],gentei:null,menuV:3,luck:gauss(),tide:0,criticPass:0,streak43:0,legendPath:null,mgmt:0,conn:0,secret:0,noren:false,train:null,novice:false,talents:[],vision:null};
  S.weather=genWeather(0);S.tomorrow=genWeather(1);
  S.buzz.push({mult:.6,days:10,label:'開店景気'});
}
function blankMonth(){return{sales:0,food:0,waste:0,labor:0,util:0,rent:0,loan:0,ads:0,misc:0,invest:0,cust:0,lost:0,bowls:0,days:0,brSales:0,brCost:0,brCust:0,owner:0}}
const ratingOf=a=>(3.0*10+a.reduce((x,y)=>x+y,0))/(10+a.length);
const rating=()=>ratingOf(S.stars);
const seatsOf=(loc=S.loc,size=S.size)=>LOC[loc].seats+(size?8:0);
const rentOf=(loc=S.loc,size=S.size)=>LOC[loc].rent*(size?1.7:1);
// 雇える人数の上限：厨房とホールの広さ（席数）で決まる
const staffMax=k=>(k==='kitchen'?Math.max(3,Math.ceil(seatsOf()/4)):Math.max(2,Math.ceil(seatsOf()/7)))+(S.extraStaff||0); // 求人を出すと各+1（最大+2）
const hallOK=()=>S.staff.hall*8>=seatsOf();
const loanPay=()=>S.loans.reduce((a,l)=>a+l.pay,0);
const debtOf=()=>S.loans.reduce((a,l)=>a+l.left,0);

function genWeather(d){
  const x=dateOf(d),m=x.getMonth();
  let t=MONTH_T[m]+gauss()*2.6;
  const r=Math.random();let w='晴';
  if(r<MONTH_RAIN[m]) w=t<2.5?'雪':'雨'; else if(r<MONTH_RAIN[m]+.28) w='曇';
  if((m>=7&&m<=9)&&Math.random()<.025) w='台風';
  return {w,t:Math.round(t*10)/10};
}
const WICON={'晴':'☀','曇':'☁','雨':'☂','雪':'❄','台風':'嵐'};

// ───────── 原価計算 ─────────
function bowlCost(){
  const st=STYLES[S.style],m=S.menu,mk=S.market;
  const soup=st.soup*GRADES[m.grade].mult*(1+(mk.pork-1)*st.pork);
  const noodle=NOODLES[m.noodle].cost*mk.wheat*(st.noodleMult||1);
  const chashu=CHASHU[m.chashu].cost*mk.pork;
  const k=1-(S.mgmt||0)*.012-(hasT('mekiki')?.05:0); // 経営手腕：仕入れ交渉。才能「目利き」
  return {soup:soup*k,noodle:noodle*k,chashu:chashu*k,top:TOPPING*k,total:(soup+noodle+chashu+TOPPING)*k};
}
// 客が納得する価格：素材のこだわりと店の評判の分だけ上がる
function expPrice(r=rating()){const st=STYLES[S.style],m=S.menu;return st.exp+S.expBoost+GRADES[m.grade].prem+CHASHU[m.chashu].prem+NOODLES[m.noodle].prem+Math.max(0,r-3.5)*120}
function tasteCore(){
  const st=STYLES[S.style],m=S.menu;
  return st.base+GRADES[m.grade].taste*skillEff(GSK[m.grade])+NOODLES[m.noodle].taste*skillEff(NSK[m.noodle])+CHASHU[m.chashu].taste*skillEff(CSK[m.chashu])+S.skill+(S.secret||0)+(hasT('zettai')?2:0);
}
// 経験ゼロで開業した素人の不利。腕前が上がるほど薄れ、腕前5で消える
const nov=()=>S.novice?Math.max(0,1-S.skill/5):0;
function tasteBase(){return tasteCore()-Math.max(0,S.fatigue-60)*.28-5*nov()}
function maxPrep(){return S.inv.pot?400:250}
function openMinutes(){return HOURS[S.hours].iv.reduce((a,[s,e])=>a+(e-s)*60,0)}
function laborCost(){
  const n=S.staff.kitchen+S.staff.hall+S.tempStaff*0; // 派遣は別計上
  let c=0;
  for(const [s,e] of HOURS[S.hours].iv){for(let h=s;h<e;h++)c+=(h>=22?1.25:1)}
  c+=1; // 仕込み・片付け1時間
  return n*S.wage*c;
}

// ───────── 需要 ─────────
// 来店の頭打ち：評判がいくら上がっても、店を目指して来る人数は受け入れ能力（席数×営業時間）の1.6倍ほどで飽和する
function saturate(pot,cap){if(pot<=cap)return pot;const x=pot-cap;return cap+x/(1+x/(.6*cap))} // 能力までは素通し、超えた分だけ頭打ち（最大1.6倍）
const dayCap=()=>seatsOf()*openMinutes()/20;
function openShare(L){const wsum=Object.values(L.curve).reduce((a,b)=>a+b,0);let sh=0;for(const [s,e] of HOURS[S.hours].iv)for(let h=s;h<e;h++)sh+=L.curve[h]||0;return sh/wsum}
function priceFactor(price,exp,tol){const d=price-exp;let f=d>0?Math.exp(-d/(380*tol)):Math.min(1.35,Math.exp(-d/(900*tol)));if(price>=1000)f*=tol<1?.8:.9;if(price>=1200)f*=.9;return f}
function weatherF(loc,w){return {'晴':1,'曇':.97,'雨':loc==='roadside'?.9:.78,'雪':.6,'台風':.3}[w.w]}
function dowF(loc,x){let f=LOC[loc].dow[x.getDay()];if(loc==='gakusei'){const mo=x.getMonth();if(mo===7||mo===1||(mo===2&&x.getDate()<25))f*=.55}return f}
function demandFactors(){
  const L=LOC[S.loc],st=STYLES[S.style],m=S.menu,x=dateOf(S.day),w=S.weather;
  const r=rating();
  const fR=Math.min(3.6,Math.exp((r-3.2)*1.5));
  const exp=expPrice();
  let fP=priceFactor(m.price,exp,L.priceTol);
  let fW=weatherF(S.loc,w);
  let fT=clamp(1+(18-w.t)*st.temp,.7,1.35);
  let fD=dowF(S.loc,x);
  const buzz=1+S.buzz.reduce((a,b)=>a+b.mult,0);
  let fX=clamp(1+.04*(S.luck||0)+.05*(S.tide||0),.85,1.15)*menuDemand(S.loc,w.t)*(S.diff==='easy'?1.08:1)*(1-S.competitor)*(S.sns?(S.loc==='gakusei'||S.loc==='ekimae'?1.18:1.12):1)*(S.inv.cashless?(S.loc==='ekimae'?1.08:1.04):1);
  const pot=L.base*fR*fP*fW*fT*fD*S.awareness*buzz*fX;
  return {pot,fR,fP,fW,fT,fD,buzz,fX};
}

// ───────── 1日の営業 ─────────
function startDay(){
  const L=LOC[S.loc],st=STYLES[S.style];
  const f=demandFactors();
  const wsum=Object.values(L.curve).reduce((a,b)=>a+b,0);
  const iv=HOURS[S.hours].iv;
  const kitchen=S.staff.kitchen+S.tempStaff;
  const prep=Math.min(S.prep,S.potHalf?Math.floor(maxPrep()/2):maxPrep());
  const bc=bowlCost();
  const potOpen=f.pot*openShare(L);
  D={min:iv[0][0]*60,end:iv[iv.length-1][1]*60,iv,pot:potOpen>0?f.pot*saturate(potOpen,dayCap())/potOpen:0,wsum,
    soupLeft:prep,prep,soupCost:bc.soup,
    seats:Array.from({length:seatsOf()},()=>({c:null,dirty:0})),
    queue:[],orders:[],cust:[],nextId:1,
    slots:(S.staff.hall>0?3:2)+kitchen*2,
    cleanT:S.staff.hall===0?3:hallOK()?1:2,
    cook:st.cook*(1+Math.max(0,S.fatigue-60)/70+.3*nov())*(hasT('yugiri')?.85:1)+menuCount()*.3,
    taste:tasteBase(),
    sold:0,sales:0,food:0,lost:0,lostQueue:0,lostSold:0,customers:0,served:0,
    soldOut:false,closedNow:false,done:false,newReviews:[],starSum:0,starN:0,
    waitMax:0,parts:{},acc:0,steam:[],gyoza:kitchen>0&&S.menu.gyoza};
  D.fac=f.fW*f.fD*f.fT;D.dishes=todaysDishes();D.chahan=S.menuOn.includes('chahan');
  D.food+=activeDev().reduce((x,d)=>x+d.fix,0); // 追加メニューの仕込み
  // スープ仕込みの原価は先払い
  const soupTotal=prep*bc.soup;
  const gas=prep*st.gas;
  D.soupTotal=soupTotal;D.gas=gas;
  log(hm(D.min),`暖簾を出した。スープ${prep}杯分、席${seatsOf()}。天気${S.weather.w} ${S.weather.t}℃`,'info');
  S.phase='open';
  render();
}
function isOpenAt(min){return !D.closedNow&&D.iv.some(([s,e])=>min>=s*60&&min<e*60)}
function lambdaAt(min){
  const L=LOC[S.loc];const h=Math.floor(min/60);
  return D.pot*(L.curve[h]||0)/D.wsum/60;
}
function stepMinute(){
  const st=STYLES[S.style],r=rating(),m=S.menu;
  const open=isOpenAt(D.min);
  // 来店
  if(open&&!D.soldOut){
    const qd=D.queue.length>8?Math.max(.35,1-(D.queue.length-8)/25):1; // 行列が長いと、見越して来ない人が増える
    const n=poisson(lambdaAt(D.min)*qd);
    for(let i=0;i<n;i++){
      const wet=S.weather.w==='雨'||S.weather.w==='雪';
      const tol=2+Math.random()*6+(r-3)*7-(wet?2:0)+D.seats.length*.15;
      const freeSeat=D.seats.some(s=>!s.c&&s.dirty<=0);
      if(!freeSeat&&D.queue.length>=tol){D.lost++;D.lostQueue++;if(Math.random()<.25)log(hm(D.min),`行列${D.queue.length}人を見て帰ったお客がいた`,'bad');continue}
      const c={id:D.nextId++,arr:D.min,pat:(15+Math.random()*25+(r-3)*20)*(hasT('aiso')?1.2:1),state:'q',col:pick(['#c6573f','#3f6fa0','#6b8f4e','#8d5a9e','#c9a227','#4a4a4a','#2f7f7a','#b0763c','#d8d2c4']),hair:pick(['#1c1612','#2d241b','#5a4430','#777']),seat:-1};
      D.queue.push(c);D.cust.push(c);
    }
  }
  // 行列の離脱
  for(let i=D.queue.length-1;i>=0;i--){
    const c=D.queue[i];
    if(D.min-c.arr>c.pat){D.queue.splice(i,1);c.state='gone';D.lost++;D.lostQueue++;if(Math.random()<.4)log(hm(D.min),`${Math.round(D.min-c.arr)}分待ったお客が諦めて帰った`,'bad')}
  }
  // 着席・注文
  for(let i=0;i<D.seats.length;i++){
    const s=D.seats[i];
    if(s.dirty>0){s.dirty--;continue}
    if(!s.c&&D.queue.length&&!D.soldOut){
      const c=D.queue.shift();
      c.state='s';c.seat=i;c.seatAt=D.min;s.c=c;
      D.waitMax=Math.max(D.waitMax,D.min-c.arr);D.waitSum=(D.waitSum||0)+(D.min-c.arr);D.seatN=(D.seatN||0)+1;
      const dish=pickDish();
      c.q=dish?dish.q:null;
      if(!dish||dish.soup)D.soupLeft--;
      D.sold++;
      // 注文内容
      const bcx=bowlCost();
      let bill=dish?dish.price:m.price,cost=dish?dish.cost-(dish.soup?bcx.soup:0)+15:bcx.noodle+bcx.chashu+TOPPING+15;
      c.items=dish?[dish.name]:[];
      const ex=st.extra;if(Math.random()<ex.rate){bill+=ex.price;cost+=ex.cost;c.items.push(ex.name)}
      if(m.ajitama&&Math.random()<SIDES.ajitama.rate){bill+=SIDES.ajitama.price;cost+=SIDES.ajitama.cost;c.items.push('味玉')}
      if(st.riceFree){if(Math.random()<.7){cost+=SIDES.rice.cost;c.items.push('ライス')}}
      else if(m.rice&&Math.random()<SIDES.rice.rate){bill+=SIDES.rice.price;cost+=SIDES.rice.cost;c.items.push('ライス')}
      let cookT=D.cook+(dish?dish.cookAdd:0);
      if(D.chahan&&Math.random()<.22){bill+=450;cost+=110;c.items.push('チャーハン');cookT+=1.5}
      if(D.gyoza&&Math.random()<SIDES.gyoza.rate){bill+=SIDES.gyoza.price;cost+=SIDES.gyoza.cost;c.items.push('餃子');cookT+=2}
      c.bill=bill;D.food+=cost;
      D.orders.push({c,left:cookT});
      if(D.soupLeft<=0){
        D.soldOut=true;
        log(hm(D.min),`スープが尽きた。「本日売切」の札を出す`,'bad');
        for(const q of D.queue){q.state='gone';D.lost++;D.lostSold++}
        D.queue=[];
      }
    }
  }
  // 厨房
  let used=0;
  for(const o of D.orders){if(used>=D.slots)break;o.left--;used++}
  for(let i=D.orders.length-1;i>=0;i--){
    const o=D.orders[i];
    if(o.left<=0){D.orders.splice(i,1);o.c.state='e';o.c.servedAt=D.min;o.c.eatDur=st.eat*(0.75+Math.random()*.5)+(o.c.items.length*1.5);D.served++}
  }
  // 食事→会計→退店
  for(const s of D.seats){
    const c=s.c;
    if(c&&c.state==='e'&&D.min-c.servedAt>=c.eatDur){
      leave(c);s.c=null;s.dirty=D.cleanT;
    }
  }
  D.min++;
  // 閉店判定
  const anyOpenLater=D.iv.some(([s,e])=>D.min<e*60)&&!D.closedNow;
  if(!anyOpenLater||D.soldOut){
    // 行列は閉店後もラストオーダーとして案内しない（閉店時刻で打ち切り）
    if(!anyOpenLater&&D.queue.length){for(const q of D.queue){q.state='gone';D.lost++;D.lostQueue++}D.queue=[];log(hm(D.min),'閉店時刻。並んでいたお客に頭を下げた','bad')}
    if(D.seats.every(s=>!s.c)&&D.orders.length===0){finishDay();return false}
  }
  return true;
}
function leave(c){
  const st=STYLES[S.style],m=S.menu;
  const qWait=c.seatAt-c.arr, cWait=c.servedAt-c.seatAt;
  const taste=(c.q!=null?c.q-Math.max(0,S.fatigue-60)*.28-5*nov():D.taste)+gauss()*(4+Math.max(0,S.fatigue-60)*.08+4*nov()-(hasT('zettai')?1.5:0));
  const exp=expPrice();
  const pricePen=(m.price-exp)/12;
  const qPen=Math.max(0,qWait-12)*.7*(rating()>3.8?.5:1);
  const cPen=Math.max(0,cWait-8)*1.6;
  const hall=S.staff.hall===0?-1.5:hallOK()?2:.5;
  const bonus=(st.riceFree?1.5:0)+(m.ajitama?.5:0);
  const hype=Math.max(0,rating()-3.6)*7; // 評判が上がるほど客の期待も上がる
  const val=taste-pricePen-qPen-cPen+hall+bonus-hype+focusAdj()+(S.diff==='easy'?1.5:0)+(hasT('aiso')?1.5:0);
  const star=clamp(1+(val-36)/12+gauss()*.5,1,5);
  D.sales+=c.bill;D.customers++;D.starSum+=star;D.starN++;
  c.state='gone';
  const p=.06+(star<2||star>4.5?.05:0);
  if(Math.random()<p){
    const text=reviewText(star,{taste,pricePen,qWait,cWait,hall});
    const rv={star:Math.round(star*2)/2,text,day:S.day};
    D.newReviews.push(rv);
    log(hm(D.min),`口コミ投稿 ${stars(rv.star)}「${text}」`,star>=3.5?'good':star<2.5?'bad':'');
  }
}
function reviewText(star,f){
  const st=STYLES[S.style],m=S.menu;
  const cand=[];
  if(f.qWait>20)cand.push([f.qWait/10,`${Math.round(f.qWait)}分並んだ。${star>=3.5?'並ぶ価値はある。':'さすがに長い。'}`]);
  if(f.cWait>10)cand.push([f.cWait/5,`着丼まで${Math.round(f.cWait)}分。厨房が回っていない。`]);
  if(f.pricePen>4)cand.push([f.pricePen/2,m.price>=1000?`美味しいけど${m.price}円はちょっと考える。`:`この内容で${m.price}円は割高に感じた。`]);
  if(f.hall<0)cand.push([1.2,'卓上が片付いていなかった。店主ひとりで大変そう。']);
  if(S.fatigue>70)cand.push([2,'今日は味がぼやけていた気がする。']);
  if(f.taste>72)cand.push([3,pick([`スープを最後まで飲み干した。${st.name}ならここ。`,'麺とスープの一体感がすごい。','チャーシューが絶品。また来ます。','この味が近所にあるのは幸せ。'])]);
  if(st.riceFree)cand.push([.8,'ライス無料がありがたい。']);
  if(f.taste<62)cand.push([1.5,pick(['可もなく不可もなく。',`普通の${st.name}ラーメン。`,'スープがもう一歩。'])]);
  if(!cand.length)cand.push([1,star>=3.5?pick(['安定のうまさ。','また来たい。','いい店を見つけた。']):pick(['悪くはない。','普通に食べられる。'])]);
  cand.sort((a,b)=>b[0]-a[0]);
  return cand[Math.random()<.7?0:Math.min(1,cand.length-1)][1];
}

function finishDay(){
  if(D.done)return;D.done=true;
  const st=STYLES[S.style];
  const labor=laborCost()+S.tempStaff*2000*(openMinutes()/60+1);
  const util=3200+D.gas+openMinutes()*10+(S.inv.deodor?400:0);
  let waste=Math.max(0,D.soupLeft)*D.soupCost;
  if(hasT('kenyaku')){const rf=waste*.4;waste-=rf;D.soupTotal-=rf}
  const sns=S.sns?3000:0;
  S.cash+=D.sales-D.food-D.soupTotal-labor-util-sns;
  const profit=D.sales-D.food-D.soupTotal-labor-util-sns;
  // 口コミ反映
  for(const rv of D.newReviews){S.stars.push(rv.star);S.rTotal++;S.reviews.unshift(rv)}
  if(S.stars.length>150)S.stars.splice(0,S.stars.length-150);
  S.reviews=S.reviews.slice(0,40);
  // 認知度
  const avg=D.starN?D.starSum/D.starN:3;
  S.awareness=clamp(S.awareness+.0015+D.customers*(avg-2.7)*.00003*(hasT('hitotarashi')?1.3:1)*(S.vision&&S.vision.shop==='local'?1.1:1),.2,Math.max(S.awareness,1.0));
  // 熟練・疲労
  S.conn=Math.min(10,(S.conn||0)+(.002+Math.max(0,rating()-3.5)*.003)*(hasT('hitotarashi')?1.5:1)); // 営業を続けると業者から声がかかる
  S.skill=Math.min(15,S.skill+(.008+D.served*.00005)*Math.max(.1,1-S.skill/16)); // 上達するほど伸びは緩やか
  const load=(S.diff==='easy'?.7:1)*(1+.25*nov())*(hasT('dandori')?.85:1)*(activeDev().reduce((a,d)=>a+d.fat,0)+openMinutes()/60*3.2+D.served*.085+D.prep*.02+(isHomeNoodle(S.menu.noodle)?6:0)-S.staff.kitchen*10-S.staff.hall*5-S.tempStaff*8-(S.mgmt||0)*.6);
  S.fatigue=clamp(S.fatigue+load-38,0,100);
  // 月次集計
  const M=S.month;
  M.sales+=D.sales;M.food+=D.food+D.soupTotal-waste;M.waste+=waste;M.labor+=labor;M.util+=util;M.ads+=sns;M.cust+=D.customers;M.lost+=D.lost;M.bowls+=D.sold;M.days++;
  S.hist.push({d:S.day,sales:D.sales,profit,cust:D.customers,rating:rating(),lost:D.lost,waste,fac:D.fac,so:D.soldOut});
  if(S.hist.length>60)S.hist.shift();
  S.lastReport={day:S.day,sales:D.sales,food:D.food+D.soupTotal-waste,waste,wasteN:Math.max(0,D.soupLeft),labor,util,sns,profit,cust:D.customers,sold:D.sold,lost:D.lost,lostQ:D.lostQueue,lostS:D.lostSold,avgStar:D.starN?avg:null,reviews:D.newReviews.slice(0,3),waitMax:D.waitMax,soldOut:D.soldOut,prep:D.prep};
  simBranches();S.lastReport.br=S.brToday;
  if(S.critic&&S.critic.day===S.day)judgeCritic(avg);
  checkStages();
  log(hm(D.min),`閉店。来客${D.customers}人、売上${yen(D.sales)}`,'info');
  S.phase='report';
  render();
}

// ───────── 日送り・月次 ─────────
function nextDay(){
  const prevMonth=dateOf(S.day).getMonth();
  S.day++;D=null;
  // バズ・競合の減衰
  S.buzz.forEach(b=>b.days--);S.buzz=S.buzz.filter(b=>b.days>0);
  if(!S.buzz.some(b=>b.exp))S.expBoost=0;
  S.competitor=Math.max(0,S.competitor-.0025);
  S.tide=clamp((S.tide||0)*.97+gauss()*.05,-1,1); // 流れ（本人には見えない）
  S.market.pork=1+(S.market.pork-1)*.985+gauss()*.004;
  S.tempStaff=0;S.potHalf=false;
  if(S._restoreStaff){S.staff=S._restoreStaff;delete S._restoreStaff}
  S.weather=S.tomorrow;S.tomorrow=genWeather(S.day+1);
  devProgress();
  const mo=dateOf(S.day).getMonth();
  if(mo!==prevMonth){monthEnd();if(S.phase==='over')return}
  if(S.day>=RETIRE_DAY){retire();return}
  if(S.cash<-500000){gameOver('運転資金が50万円以上マイナスになり、仕入先が取引を止めた。');return}
  S.event=null;S.phase='morning';pendingClose=null;
  if(S.fatigue>=90&&Math.random()<(hasT('fukutsu')?.12:.35)){S.sick=true}
  if(S.day<=S.closedUntil){S.phase='closed';S.closedTitle='移転工事中';S.closedReason=`${LOC[S.loc].name}の新店舗で内装工事中。${fmtDate(S.closedUntil+1)}に新装開店。`;}
  else if(S.sick){S.phase='closed';S.closedTitle='臨時休業';S.closedReason='店主が体調を崩し、臨時休業。';}
  else if(dateOf(S.day).getDay()===S.closedDow){S.phase='closed';S.closedTitle='定休日';S.closedReason='定休日。';}
  if(S.critic&&S.critic.day===S.day&&S.phase!=='morning')S.critic.day=S.day+1;
  if(S.critic&&S.critic.day===S.day)log('朝','今日は伝説の評論家が来店する日だ','info');
  checkStages();
  if(S.phase==='morning'&&S.day>1&&Math.random()<.2)rollEvent();
  save();render();
}
function restDay(){
  // 休業日：家賃は日割りで発生（月末計上）。疲労回復。
  S.fatigue=clamp(S.fatigue-55,0,100);S.sick=false;
  simBranches();
  S.hist.push({d:S.day,sales:0,profit:0,cust:0,rating:rating(),closed:true,lost:0,waste:0});
  if(S.hist.length>60)S.hist.shift();
  log('—',`${fmtDate(S.day)} 休業。店主は休んだ`,'info');
  nextDay();
}
function monthEnd(){
  const M=S.month;
  M.rent=rentOf();M.misc+=LEASE+M.bowls*12+50000;M.owner=OWNER;
  S.cash-=M.rent+LEASE+M.bowls*12+50000+OWNER;
  for(const b of S.branches){if(S.day-1<b.openDay)continue;const f=rentOf(b.loc,b.size)+b.mgr.salary+50000;M.brCost+=f;b.month.cost+=f;S.cash-=f}
  M.loan=0;
  for(const l of S.loans){const pp=Math.min(l.pay,Math.ceil(l.left/.85));S.cash-=pp;M.loan+=pp;l.left=Math.max(0,Math.round(l.left-pp*.85))}
  S.loans=S.loans.filter(l=>l.left>0);
  const mainProfit=M.sales-M.food-M.waste-M.labor-M.util-M.rent-M.ads-M.misc-M.owner;
  const brProfit=M.brSales-M.brCost;
  const profit=mainProfit+brProfit;
  const label=`${Math.floor((S.day-1)/365)+1}年目 ${dateOf(S.day-1).getMonth()+1}月`;
  const brs=S.branches.filter(b=>S.day-1>=b.openDay).map(b=>({name:b.name,sales:b.month.sales,profit:b.month.sales-b.month.cost,cust:b.month.cust,rating:ratingOf(b.stars)}));
  S.branches.forEach(b=>b.month={sales:0,cost:0,cust:0});
  S.months.push({label,...M,mainProfit,brProfit,profit,brs});
  S.totalProfit+=profit;
  S.bestMonthCust=Math.max(S.bestMonthCust,M.cust);
  S.streak42=rating()>=4.2?S.streak42+1:0;S.streak43=rating()>=4.3?(S.streak43||0)+1:0;
  // 相場の月次変動
  S.market.wheat=clamp(S.market.wheat+gauss()*.015,.9,1.5);
  queueModal(monthHTML(S.months[S.months.length-1]));
  S.month=blankMonth();
  if(S.cash<0){gameOver(`${label}末の支払いで資金がマイナスに。家賃とローンが払えず、閉店を決めた。`)}
}

const NEG=new Set(['pork','wheat','absent','competitor','inspect','burner','smell','quit']);
function rollEvent(){
  const pool=EVENTS.filter(e=>e.ok());
  if(!pool.length)return;
  let t=Math.random()*pool.reduce((a,e)=>a+e.w*(NEG.has(e.id)?clamp(1-.25*(S.luck||0),.4,1.6):clamp(1+.25*(S.luck||0),.4,1.6)),0);
  for(const e of pool){t-=e.w*(NEG.has(e.id)?clamp(1-.25*(S.luck||0),.4,1.6):clamp(1+.25*(S.luck||0),.4,1.6));if(t<=0){if(S.diff==='easy'&&NEG.has(e.id)&&Math.random()<.5)return;S.event=e.id;return}}
}
function showEvent(){
  const e=EVENTS.find(x=>x.id===S.event);if(!e)return;
  openModal(`<div class="card" role="dialog" aria-modal="true" aria-labelledby="evh"><div class="chead"><p>${fmtDate(S.day)} 朝の知らせ</p><h2 id="evh">${esc(e.title)}</h2></div>
   <div class="cbody"><p style="margin:0">${esc(e.body)}</p><div class="opt">${e.choices.map((c,i)=>`<button data-act="ev" data-i="${i}"><b>${esc(c.t)}</b><span>${esc(c.d)}</span></button>`).join('')}</div></div></div>`);
}

// ───────── 目標：伝説への道 ─────────
const STAGES=[
  {name:'開業1周年',desc:'1年間、店を潰さずに続ける',conds:()=>[[`営業日数 ${Math.min(S.day+1,365)}/365日`,S.day>=364]]},

  {name:'一国一城',desc:'移転か支店出店をして、借入をすべて返す',conds:()=>[[`移転・出店 ${S.relocated||S.branches.length?'済':'まだ'}`,S.relocated||S.branches.length>0],[`借入残高 ${yen(debtOf())}`,debtOf()<=0]]},
  {name:'名店',desc:'評価★4.2以上を6か月連続で保ち、雑誌かテレビに取り上げられる',conds:()=>[[`月末に★4.2以上の連続 ${S.streak42}/6か月`,S.streak42>=6],[`メディア掲載 ${S.media?'済':'まだ'}`,S.media]]},
  {name:'伝説のラーメン屋',desc:'開業5年以上で3つの道のどれかを極め、年に一度来る伝説の評論家に2度認められる',conds:()=>{const bp=anyPath()||bestPath();return [[`暖簾を守った年月 ${Math.min(5,Math.floor(S.day/365))}/5年`,S.day>=LEGEND_DAY],[`伝説への道「${bp.name}」 ${bp.conds().filter(c=>c[1]).length}/${bp.conds().length}`,!!anyPath()],[`評論家に認められた回数 ${S.criticPass||0}/2${S.critic?`（${fmtDate(S.critic.day)}に来店予定）`:''}`,S.legend]]}},
];
function checkStages(){
  if(!S||S.phase==='over')return;
  if(S.stage===4&&!S.critic&&!S.legend&&S.day>=S.criticNext&&S.day>=LEGEND_DAY&&anyPath()){
    S.critic={day:S.day+3};
    queueModal(noticeHTML('伝説の評論家から予告状',`「三日後、貴店の一杯を頂きに伺う」。評論家が来るのは年に一度だけ。${fmtDate(S.critic.day)}の営業で、味・待ち時間・お客の満足度を見られる。認められるには2度の合格が要る（いま${S.criticPass||0}度）。疲労を抜き、仕込みを万全に。`));
    log('—','伝説の評論家から予告状が届いた','info');
  }
  while(S.stage<STAGES.length&&STAGES[S.stage].conds().every(c=>c[1])){
    const i=S.stage;S.stageDay[i]=S.day;S.stage++;
    queueModal(stageHTML(i));
    log('—',`目標達成：${STAGES[i].name}`,'good');
  }
}
function judgeCritic(avg){
  const avgW=D.seatN?D.waitSum/D.seatN:0;
  const ok=D.taste>=85&&avg>=4.3&&avgW<=25;
  S.critic=null;S.criticNext=S.day+365; // 評論家は年に一度
  if(!ok){
    const why=D.taste<85?`味の点数が足りない（${D.taste.toFixed(1)}点／85点）`:avg<4.3?`お客の満足度が足りない（平均${avg.toFixed(2)}／4.3）`:`待たせすぎた（平均${Math.round(avgW)}分。25分以内が条件）`;
    S.lastReport.criticMsg=`伝説の評論家は無言で店を出た。不合格：${why}。次に来るのは一年後だ。`;return;
  }
  // 基準を満たしても、最後は評論家の心に届くかどうか。運と流れが絡み、本人には見えない
  const q=clamp(1+(D.taste-85)*.015+(avg-4.3)*.3,.6,1.3);
  const pPass=clamp((S.diff==='easy'?.045:.034)*Math.exp(.7*(S.luck||0)+1.5*(S.tide||0))*q,.005,.3);
  if(Math.random()<pPass){
    S.criticPass=(S.criticPass||0)+1;
    if(S.criticPass>=2){const p=anyPath();S.legend=true;S.legendPath=p?p.id:null;S.lastReport.criticMsg=`伝説の評論家「……この一杯は、時代に残る」。2度目の合格。「${p?p.title:'伝説'}」と呼ばれる店になった。`}
    else S.lastReport.criticMsg='伝説の評論家はスープを最後まで飲み干し、「また来年」とだけ言って帰った。1度目の合格。';
  }else S.lastReport.criticMsg='伝説の評論家は箸を置き、黙って店を出た。何が足りなかったのか、分からない。次に来るのは一年後だ。';
}
function noticeHTML(title,body){
  return `<div class="card" role="dialog" aria-modal="true" aria-labelledby="nth"><div class="chead"><p>${fmtDate(S.day)}</p><h2 id="nth">${esc(title)}</h2></div><div class="cbody"><p style="margin:0">${esc(body)}</p></div><div class="cfoot"><button class="btn primary" data-act="closemodal">受けて立つ</button></div></div>`;
}
function stageHTML(i){
  const st=STAGES[i],legend=i===STAGES.length-1;
  const y=Math.floor(S.day/365),mo=Math.floor((S.day%365)/30.4);
  const dg=diagnose();
  const lp=legend&&S.legendPath?LEGEND_PATHS.find(p=>p.id===S.legendPath):null;

// reward：プレイヤーが自分で選んだ行動の前に1回（見るかどうかは本人が選ぶ）。
// break：区切りに出すが、遊び始めて15分と、前回の広告から3分以内は出さない。広告が用意できないときは、ゲームを止めずにそのまま進める。
function adGate(slot,go){
  const sl=AD_SLOTS[slot];
  const live=AD.loaded&&typeof window.adBreak==='function';
  if(adFree()||!sl||(!live&&!AD.preview)){go();return}
  const now=Date.now();
  if(sl.kind==='break'&&(now-AD.start<15*60e3||now-AD.last<3*60e3)){go();return}
  if(live){
    if(sl.kind==='break'){AD.last=now;window.adBreak({type:'next',name:slot,adBreakDone:()=>go()});return}
    AD.viewed=false;AD.show=null;AD.pending=go;
    window.adBreak({type:'reward',name:slot,
      beforeReward:show=>{AD.show=show;openModal(adModal(sl,'<p style="margin:0">短い動画広告を見ると、この行動に進める。</p>','<button class="btn primary" data-act="adshow">広告を見て進む</button><button class="btn ghost" data-act="adcancel">やめる</button>'))},
      adViewed:()=>{AD.viewed=true},
      adDismissed:()=>{AD.viewed=false},
      adBreakDone:info=>{
        const st=info&&info.breakStatus;
        const fn=AD.pending;AD.pending=null;AD.show=null;
        if(st==='viewed'||AD.viewed){AD.last=Date.now();closeModal();if(fn)fn()}
        else if(st==='dismissed'){closeModal();log('—','広告を最後まで見なかったので、やめておいた','info')}
        else if(st!=='ignored'&&fn){closeModal();fn()} // 広告が用意できない・回数制限などは止めずに進める
        save();render();
      }});
    return;
  }
  // #adpreview のダミー広告
  AD.last=now;AD.pending=go;
  let left=5;
  openModal(adModal(sl,`<div class="adbox"><b>広告枠：${esc(sl.name)}</b><span>本番ではここに AdSense の動画広告が入る（いまはダミー）</span></div>`,`<button class="btn primary" data-act="adclose" id="adbtn" disabled>あと${left}秒</button>`));
  clearInterval(AD.timer);
  AD.timer=setInterval(()=>{left--;const bt=document.getElementById('adbtn');if(!bt){clearInterval(AD.timer);return}
    if(left<=0){clearInterval(AD.timer);bt.disabled=false;bt.textContent='閉じて進む'}else bt.textContent=`あと${left}秒`},1000);
}

function diagnose(){
  const st=STYLES[S.style],m=S.menu,bc=bowlCost();
  const rec=S.hist.filter(h=>!h.closed).slice(-30),n=rec.length;
  const avg=k=>n?rec.reduce((a,h)=>a+(h[k]||0),0)/n:0;
  const cust=avg('cust'),profit=avg('profit'),lost=avg('lost'),waste=avg('waste'),sales=avg('sales');
  const fixedDaily=(rentOf()+loanPay()+LEASE+50000+OWNER)/30;
  const costR=bc.total/m.price, gap=Math.round(m.price-expPrice());
  const lostR=cust+lost>0?lost/(cust+lost):0;
  const staff=S.staff.kitchen+S.staff.hall;
  const ax={
    taste:clamp((tasteBase()-50)/45*100,0,100),
    value:clamp(60-gap/5,0,100),
    turn:clamp(100-lostR*250-(S.staff.hall?0:12),0,100),
    profit:n?clamp(50+(profit-fixedDaily)/Math.max(1,fixedDaily)*35,0,100):50,
    stamina:clamp(100-S.fatigue,0,100),
    future:clamp((rating()-3)*45+S.awareness*25+S.branches.length*8,0,100),
  };
  const score=Object.values(ax).reduce((a,b)=>a+b,0)/6;
  const grade=score>=85?'S':score>=72?'A':score>=58?'B':score>=45?'C':'D';
  const T=[
    {s:n<7?999:0,name:'手探り開業型',desc:'まだ店の形が見えていない。数字より、毎日の手応えを集める時期。',q:'いまはまだ、勢いだけで走っている。'},
    {s:(ax.taste-ax.profit)*1.2+(costR>.36?20:0),name:'職人こだわり型',desc:`一杯の完成度は高い。けれど原価率${(costR*100).toFixed(0)}%で、売るほど儲かる店にはなっていない。`,q:'その味を、続けられる値段で出せていない。'},
    {s:(gap<-40?40:0)+(costR<.28?10:0)+(cust>80?20:0)-ax.taste*.2,name:'薄利多売型',desc:'安さで客を集めている。忙しさの割に、手元に残るお金は少ない。',q:'忙しさの割に、報われていない。'},
    {s:(staff===0?40:0)+(S.fatigue>65?S.fatigue-30:0),name:'ワンオペ根性型',desc:`店主ひとりの体力で店が回っている。疲労は${Math.round(S.fatigue)}。倒れたら売上はゼロ。`,q:'あなたが倒れたら、この店は止まる。'},
    {s:lostR*250,name:'行列取りこぼし型',desc:`並ぶのを諦めて帰る客が1日平均${lost.toFixed(0)}人。需要はあるのに、店が受け止めきれていない。`,q:'帰っていった客は、別の店の常連になっている。'},
    {s:(sales?waste/sales*300:0)+(costR>.4?25:0)+(profit<0?20:0),name:'どんぶり勘定型',desc:'仕込みと値付けが感覚頼み。廃棄と原価が利益を食っている。',q:'今月いくら残るか、即答できない。'},
    {s:(profit>fixedDaily?30:0)+(!S.branches.length&&!S.relocated?15:0)+(ax.taste<60?10:0),name:'堅実守り型',desc:'赤字は出さないが、攻めの一手もない。街の普通の店として落ち着きつつある。',q:'このままでは「普通の店」で終わる。'},
    {s:S.branches.length*35+(S.relocated?15:0),name:'拡大路線型',desc:`${1+S.branches.length}店舗を抱える経営者。本店の味と支店の質の両立が鍵。`,q:'店を増やすほど、味が薄まる危うさがある。'},
    {s:(menuCount()>=3?30+menuCount()*8:0)+(ax.taste<60?10:0),name:'メニュー迷走型',desc:`品書きは看板を含めて${1+S.menuOn.length}品。客層は広がったが、何の店か伝わりにくくなっている。`,q:'看板の一杯が、品書きに埋もれている。'},
    {s:(menuCount()===0&&ax.taste>=70&&n>=7?45:0),name:'一点突破型',desc:'看板の一杯だけで勝負する潔い店。味が評判を引っぱっている。',q:'その一杯が飽きられた日の備えがない。'},
    {s:(rating()>=4?50:0)+(profit>fixedDaily*1.5?30:0),name:'ブランド確立型',desc:'味・評判・数字がそろい、街の顔になりつつある店。',q:'伝説まで、あと一歩のところにいる。'},
  ];
  T.sort((a,b)=>b.s-a.s);
  const ADV={taste:'スープのグレードやチャーシューを見直して、味の点数を上げる。',
    value:gap>0?`価格が相場より${gap}円高い。値付けと中身の釣り合いを見直す。`:'価格に対して中身が見劣りしている。素材を一段上げる。',
    turn:'厨房かホールに人を足して、行列を受け止める。',
    profit:'原価率と仕込み量を見直し、固定費を超える粗利を出す。',
    stamina:'定休日を設けるかバイトを入れて、店主の疲労を下げる。',
    future:'口コミ評価と認知度を上げる。チラシや看板、味の改善が効く。'};
  const weak=Object.entries(ax).sort((a,b)=>a[1]-b[1]).slice(0,3).map(([k])=>ADV[k]);
  return {t:T[0],ax,score,grade,weak};
}

function doBranch(){
  const cost=openCost(BF.loc,BF.size),fin=financeBlock(cost,BF.loan);
  const need=cost-(fin.loan?fin.t.amt:0);if(S.cash<need)return;
  S.cash-=need;S.month.invest+=cost;

function simBranches(){
  S.brToday=[];
  if(dateOf(S.day).getDay()===S.closedDow)return;
  for(const b of S.branches){
    if(S.day<b.openDay)continue;
    const r=simBranch(b);
    S.brToday.push({id:b.id,name:b.name,...r});
    S.month.brSales+=r.sales;S.month.brCost+=r.cost;S.month.brCust+=r.cust;
    b.month.sales+=r.sales;b.month.cost+=r.cost;b.month.cust+=r.cust;
    S.cash+=r.sales-r.cost;
    if(S.day===b.openDay)log('—',`「${b.name}」が開店した`,'good');
  }
}
function simBranch(b){
  const L=LOC[b.loc],st=STYLES[S.style],m=S.menu,w=S.weather,x=dateOf(S.day);
  const r=ratingOf(b.stars);
  const fR=Math.min(3.6,Math.exp((r-3.2)*1.5));
  const fP=priceFactor(m.price,expPrice(r),L.priceTol);
  const fT=clamp(1+(18-w.t)*st.temp,.7,1.35);
  const brand=1+S.buzz.reduce((a,z)=>a+z.mult,0)*.5+Math.max(0,rating()-3.5)*.3;
  const wsum=Object.values(L.curve).reduce((a,c)=>a+c,0);
  let share=0;for(let h=11;h<22;h++)share+=L.curve[h]||0;share/=wsum;
  let pot=L.base*fR*fP*weatherF(b.loc,w)*fT*dowF(b.loc,x)*b.aw*brand*(S.sns?1.08:1)*menuDemand(b.loc,w.t)*(S.diff==='easy'?1.08:1)*clamp(1+.04*(S.luck||0)+.05*(S.tide||0),.85,1.15)*share*rnd(.85,1.15);
  const cap=seatsOf(b.loc,b.size)*1.8*11*rnd(.9,1.05);
  pot=saturate(pot,cap);
  const cust=Math.round(Math.min(pot,cap)),lost=Math.max(0,Math.round(pot-cap));
  const bc=bowlCost(),ex=st.extra;
  const sideP=ex.rate*ex.price+(m.ajitama?SIDES.ajitama.rate*SIDES.ajitama.price:0)+(!st.riceFree&&m.rice?SIDES.rice.rate*SIDES.rice.price:0)+(m.gyoza?SIDES.gyoza.rate*SIDES.gyoza.price:0);
  const sideC=ex.rate*ex.cost+(m.ajitama?SIDES.ajitama.rate*SIDES.ajitama.cost:0)+(st.riceFree?.7*SIDES.rice.cost:m.rice?SIDES.rice.rate*SIDES.rice.cost:0)+(m.gyoza?SIDES.gyoza.rate*SIDES.gyoza.cost:0);
  const sales=cust*(m.price+sideP);
  const food=cust*(bc.total+sideC+15)+Math.max(15,cust*.1)*bc.soup;
  const labor=(2+Math.ceil(cust/90))*S.wage*12;
  const util=3500+cust*1.1*st.gas+660*10;
  const cost=food+labor+util;
  const taste=tasteCore()-(10-b.mgr.skill)*1.1;
  const val=taste-(m.price-expPrice(r))/12+2+(lost>cust*.2?-2:0)+(st.riceFree?1.5:0)+(m.ajitama?.5:0)-Math.max(0,r-3.6)*7+focusAdj()+(S.diff==='easy'?1.5:0);
  const avg=clamp(1+(val-36)/12,1,5);
  const nr=poisson(cust*.06);
  for(let i=0;i<nr;i++){b.stars.push(Math.round(clamp(avg+gauss()*.55,1,5)*2)/2);b.total++}
  if(b.stars.length>150)b.stars.splice(0,b.stars.length-150);
  b.aw=clamp(b.aw+.0015+cust*(avg-2.7)*.00003,.2,1.0);
  if(avg<3)S.awareness=Math.max(.2,S.awareness-(3-avg)*.002);
  b.mgr.skill=Math.min(10,b.mgr.skill+.01);
  return {cust,lost,sales,cost,profit:sales-cost,avg,rating:ratingOf(b.stars)};
}

function prepEstimate(){
  const f=demandFactors(),L=LOC[S.loc];
  const wsum=Object.values(L.curve).reduce((a,b)=>a+b,0);
  let share=0;for(const [s,e] of HOURS[S.hours].iv)for(let h=s;h<e;h++)share+=L.curve[h]||0;
  let est=saturate(f.pot*share/wsum,dayCap());
  const last=S.hist.filter(h=>!h.closed&&h.fac).slice(-1)[0];
  if(last){const yd=last.cust*(last.so?1.25:1)*(f.fW*f.fD*f.fT)/last.fac;est=(est+yd)/2}
  const slots=(S.staff.hall>0?3:2)+S.staff.kitchen*2;
  const cap=Math.min(seatsOf()*openMinutes()/22,slots*openMinutes()/(STYLES[S.style].cook+menuCount()*.3));
  est=Math.min(est,cap)*(1-activeDev().filter(d=>!d.side&&!d.soup).reduce((a,d)=>a+d.share,0));
  return clamp(Math.ceil(est*1.1/10)*10,20,S.potHalf?Math.floor(maxPrep()/2):maxPrep());
}

  if(gap>120)L.push(`この辺りで${S.menu.price}円は高い。客は正直だぞ。`);

  if(menuCount()>=3)L.push('品書きが多すぎる。何屋か分からなくなってるぞ。');
  {const e=Math.min(skillEff(GSK[S.menu.grade]),skillEff(NSK[S.menu.noodle]),skillEff(CSK[S.menu.chashu]));if(e<.8)L.push(`いい材料を使っても、腕が追いついてないと${Math.round(e*100)}%しか活きない。背伸びするより、腕に合った材料で磨け。`)}
  if(S.cash>3e6&&S.day>30&&GREQ[Math.min(4,S.menu.grade+1)]>(S.conn||0)&&S.day%6===0)L.push('いい材料は、いい付き合いからしか回ってこない。業者と会っておけ。');
  const weakDish=activeDev().find(d=>!d.side&&S.dev[d.id].q<tasteCore()-6);
  if(weakDish)L.push(`「${weakDish.name()}」は看板より出来が落ちる（${S.dev[weakDish.id].q.toFixed(1)}点）。作り直すか、品書きから下ろせ。`);
  if(S.day>30&&menuCount()===0&&S.day%7===0)L.push('一本で勝負するのもいい。だが夏につけ麺、限定麺で話題を作る手もある。');
  if(!L.length)L.push(pick(['いい調子だ。数字を見る癖をつけろ。','昨日より一杯でも旨く。それだけだ。','常連の顔を覚えろ。それが一番の宣伝だ。']));
  return L.slice(0,3);
}

  {p:t=>.04,f:t=>{t.motiv+=10;return '家族から差し入れと手紙が届いた。もう少し頑張れる。'}},

function startTraining(){
  S.phase='train';
  S.train={unit:'w',cnt:{},survived:false,m:0,role:0,roleM:0,skill:0,mgmt:0,conn:0,trust:50,fat:10,motiv:70,save:0,secret:0,day:'obey',night:'rest',last:null,crisis:null,held:false};
}
const trainAge=w=>`${Math.floor(w/52)+1}年目 第${w%52+1}週`;
const trainSpan=w=>{const y=Math.floor(w/52),mo=Math.floor((w%52)/4.34);return `${y?y+'年':''}${mo?mo+'か月':y?'':w+'週'}`};
function trainRank(t){
  const sc=t.skill+t.mgmt+t.conn+t.trust/25;
  return sc>=16?'師範代':sc>=11?'一人前':sc>=6?'半人前':'見習い';
}
function trainWeeks(n){
  const t=S.train,all=[];let title='';
  for(let i=0;i<n;i++){
    if(t.crisis||t.pending||t.m>=TRAIN_MAX)break;
    const role0=t.role;
    trainWeek();
    if(!title)title=t.last.title;
    all.push(...t.last.msgs.map(m=>`第${(t.m-1)%52+1}週：${m}`));
    if(t.crisis||t.pending||t.role!==role0||t.last.msgs.length)break;
  }
  if(n>1&&t.last){const [a,b]=title.split('：');t.last={title:`${a}〜第${(t.m-1)%52+1}週：${b||''}`,msgs:all}}
}
function trainWeek(){
  const t=S.train;if(t.crisis||t.pending||t.m>=TRAIN_MAX)return;
  const d=DAY_ACTS.find(x=>x.id===t.day),n=NIGHT_ACTS.find(x=>x.id===t.night),r=ROLES[t.role];
  const msgs=[];
  t.m++;t.roleM++;
  t.cnt=t.cnt||{};t.cnt[d.id]=(t.cnt[d.id]||0)+1;t.cnt[n.id]=(t.cnt[n.id]||0)+1;
  const eff=t.fat>85?.5:1;
  if(eff<1)msgs.push('疲れが抜けず、何をやっても身につき方が半分だった。');
  const dim=v=>1-v/12; // 上達するほど伸びにくい
  t.skill+=(r.skill*d.mul+(n.skill||0))*eff*dim(t.skill)*WK*(t.vCraft==='taste'?1.15:1);
  t.mgmt+=(r.mgmt+(d.mgmt||0)+(n.mgmt||0))*eff*dim(t.mgmt)*WK*(t.vCraft==='manage'?1.15:1);
  t.conn+=(r.conn+(d.conn||0)+(n.conn||0))*eff*dim(t.conn)*WK*(t.vCraft==='people'?1.15:1);
  t.trust+=(d.trust+(n.trust||0))*WK;
  if(d.risk&&Math.random()<d.risk*WK){t.trust-=4;t.motiv-=5;msgs.push('手を止めて師匠の手元を見ていたら「見てる暇があったら手を動かせ」と怒鳴られた。')}
  t.fat=clamp(t.fat+(10+(n.fat||0)-12)*WK,0,110);
  t.save+=Math.round((10000-(n.cost||0)+(n.save||0))*WK); // 見習いの給料18万−生活費17万（月）
  const al=t.vCraft==='taste'?d.id==='steal'||n.id==='soup':t.vCraft==='manage'?d.id==='watch'||n.id==='study':t.vCraft==='people'?d.id==='watch'||n.id==='net'||n.id==='tour':false; // ビジョンに沿った週は心が保てる
  t.motiv+=(-3+(al?2:0)+(d.motiv||0)+(n.motiv||0)+(t.fat>60?-6:0)+(t.role===0&&t.roleM>26?-3:0))*WK;
  if(t.night==='soup'&&t.secret<6&&Math.random()<.035*WK*(t.ownTaste?2:1)){t.secret+=2;msgs.push('閃いた。スープの火入れに自分だけのコツを見つけた（秘伝の技 +2）。')}
  if(t.fat>=100){t.fat=50;t.motiv-=8;t.trust-=2;msgs.push('無理がたたって寝込み、一週間店に出られなかった。')}
  if(Math.random()<.35*WK){for(const e of TRAIN_EVENTS){if(Math.random()<e.p(t)*2.5){msgs.push(e.f(t));break}}}
  talentTick(t,msgs);
  // 昇格
  const nx=ROLES[t.role+1];
  if(nx&&nx.req(t)){t.role++;t.roleM=0;t.motiv+=10;msgs.push(`師匠「明日から${nx.name}をやれ」。認められた。`)}
  t.skill=clamp(t.skill,0,10);t.mgmt=clamp(t.mgmt,0,10);t.conn=clamp(t.conn,0,10);t.trust=clamp(t.trust,0,100);t.motiv=clamp(t.motiv,0,100);
  t.last={title:`${trainAge(t.m-1)}：昼は${d.name}、夜は${n.name}`,msgs};
  // 挫折
  if(t.motiv<=0){
    if(!t.held&&t.trust>=70){t.held=true;t.survived=true;t.motiv=35;msgs.push('辞めようと荷物をまとめていたら、師匠に呼び止められた。「お前の一杯を、まだ食ってない」。もう一度だけ頑張ることにした。')}
    else t.crisis='forced';
  }else if(t.motiv<25&&Math.random()<.3*WK)t.crisis='ask';
  if(!t.crisis&&t.m>=TRAIN_MAX)t.last.msgs.push('師匠「もう教えることはない。行け」。5年の修行が終わった。');
  if(!t.crisis&&!t.pending&&t.m<TRAIN_MAX)storyTick(t);
}
function quitTraining(){
  const t=S.train;

  S.overReason=`修行${trainSpan(t.m)||t.m+'週'}（${trainAge(Math.max(0,t.m-1))}）で辞めた。腕前${t.skill.toFixed(1)}・師匠の信頼${Math.round(t.trust)}。店を持つ夢は、ここで終わった。修行は誰にでも続けられるものではない。`;
  log('—','修行を辞めた','bad');
}
function finishTraining(){
  const t=S.train;
  S.skill=Math.round(t.skill*10)/10;S.mgmt=Math.round(t.mgmt*10)/10;S.conn=Math.round(t.conn*10)/10;S.secret=t.secret;

  S.vision={craft:t.vCraft||null,shop:t.vShop||null};
  S.trainSummary={weeks:t.m,rank:trainRank(t),role:ROLES[t.role].name,skill:S.skill,mgmt:S.mgmt,conn:S.conn,trust:Math.round(t.trust),save:t.save,secret:t.secret,noren:S.noren};
  S.train=null;S.phase='morning';

}

  const open=S.phase==='open'&&D&&!D.soldOut&&isOpenAt(D.min);
  if(S.phase==='open'||S.phase==='morning'||S.phase==='train'){
    const sway=Math.sin(t/700)*2;
    for(let k=0;k<3;k++){
      cx.fillStyle='#22315a';cx.fillRect(612+k*34+sway*(k-1)*.3,18,32,open||S.phase==='morning'||S.phase==='train'?96:60);
    }
    cx.fillStyle='#f4efe4';cx.font='22px "Dela Gothic One",sans-serif';cx.textAlign='center';
    const nm=S.phase==='train'?['修','行','先']:[...S.name.replace(/\s/g,'')].slice(0,3);
    nm.forEach((ch,k)=>cx.fillText(ch,628+k*34,58));
    cx.textAlign='left';
  }
  // 提灯
  const lg=cx.createRadialGradient(700,150,4,700,150,40);lg.addColorStop(0,open?'rgba(255,190,100,.55)':'rgba(255,190,100,.1)');lg.addColorStop(1,'rgba(255,190,100,0)');
  cx.fillStyle=lg;cx.fillRect(650,100,70,100);
  cx.fillStyle=open?'#e8742f':'#5a3a2a';cx.beginPath();cx.ellipse(700,150,14,20,0,0,Math.PI*2);cx.fill();
  // 売切札
  if(D&&D.soldOut&&S.phase==='open'){
    cx.save();cx.translate(660,140);cx.rotate(-.06);cx.fillStyle='#fffaf0';cx.fillRect(-32,0,64,90);
    cx.fillStyle='#b23a2e';cx.font='18px "Dela Gothic One",sans-serif';cx.textAlign='center';
    ['本','日','売','切'].forEach((ch,i)=>cx.fillText(ch,0,22+i*20));cx.restore();cx.textAlign='left';
  }
  // 行列
  if(D&&S.phase==='open'){
    const q=D.queue.length;
    for(let i=0;i<Math.min(q,5);i++){
      const c=D.queue[i];const x=626+ (i%2)*44, y=200+Math.floor(i/2)*38;
      cx.fillStyle=c.col;cx.beginPath();cx.roundRect(x,y+10,22,30,7);cx.fill();
      cx.fillStyle='#e2b48c';cx.beginPath();cx.arc(x+11,y+4,8,0,Math.PI*2);cx.fill();
      cx.fillStyle=c.hair;cx.beginPath();cx.arc(x+11,y+1,8,Math.PI,0);cx.fill();
    }
    if(q>0){cx.fillStyle='#ffcf73';cx.font='14px "DotGothic16",monospace';cx.fillText(`行列 ${q}人`,618,312)}
  }
  // 湯気
  steam.forEach(p=>{p.y-=p.vy;p.a-=.004;p.r+=.08;cx.fillStyle=`rgba(255,255,255,${Math.max(0,p.a)})`;cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fill()});
  steam=steam.filter(p=>p.a>0).slice(-140);
  // 休業時の暗転
  if(S.phase==='closed'||S.phase==='report'){
    cx.fillStyle='rgba(8,12,24,.55)';cx.fillRect(0,0,W,H);
    cx.fillStyle='#f4efe4';cx.font='24px "Dela Gothic One",sans-serif';cx.textAlign='center';
    cx.fillText(S.phase==='closed'?'本日休業':'本日の営業は終了しました',W/2,H/2);cx.textAlign='left';
  }
}

// ───────── ループ ─────────
let last=performance.now();
const MIN_MS=260; // 1x：ゲーム内1分＝0.26秒
function loop(t){
  const dt=Math.min(250,t-last);last=t;
  if(S&&S.phase==='open'&&D&&!D.done&&!paused){
    D.acc+=dt*speed;
    let guard=0;
    while(D.acc>=MIN_MS&&guard<400){D.acc-=MIN_MS;guard++;if(!stepMinute())break}
    if(guard&&!D.done)renderLive();
  }
  cx.clearRect(0,0,W,H);
  drawShop(t);
  requestAnimationFrame(loop);
}

function histChart(){
  const h=S.hist.slice(-30);
  if(!h.length)return '<p class="hint">営業するとここに推移が出る。</p>';
  const w=300,ht=110,pad=22;
  const max=Math.max(60000,...h.map(x=>x.sales));
  const bw=(w-pad)/30;
  const nice=Math.ceil(max/50000)*50000;
  let bars=h.map((x,i)=>{const bh=(x.sales/nice)*(ht-20);return `<rect x="${pad+i*bw+1}" y="${ht-12-bh}" width="${Math.max(2,bw-2)}" height="${bh}" fill="${x.closed?'#c9b385':x.profit<0?'#b23a2e':'#2b2118'}"><title>${fmtDate(x.d)} 売上${yen(x.sales)} 客${x.cust}人</title></rect>`}).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${ht}" role="img" aria-label="直近30日の売上">
   <line x1="${pad}" y1="${ht-12}" x2="${w}" y2="${ht-12}" stroke="#6d5a45" stroke-width="1"/>
   <line x1="${pad}" y1="${ht-12-(ht-20)/2}" x2="${w}" y2="${ht-12-(ht-20)/2}" stroke="#c9b385" stroke-dasharray="2 3"/>
   <text x="0" y="${ht-12-(ht-20)/2+4}" font-size="9" fill="#6d5a45">${nice/2/10000}万</text>
   <text x="0" y="${ht-12-(ht-20)+8}" font-size="9" fill="#6d5a45">${nice/10000}万</text>
   ${bars}<text x="${pad}" y="${ht}" font-size="9" fill="#6d5a45">黒＝黒字日　赤＝赤字日　薄＝休業</text></svg>`;
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='tab'){tab=b.dataset.k;render();return}
  if(a==='set'){
    const k=b.dataset.k,v=+b.dataset.v;
    if(k==='hours')S.hours=Object.keys(HOURS)[v];
    else if(k==='closed')S.closedDow=v-1;
    else if((k==='grade'||k==='noodle'||k==='chashu')&&v===4&&!(S.adUnlock||{})[k]){adGate('topGrade',()=>{S.adUnlock=Object.assign(S.adUnlock||{},{[k]:true});S.menu[k]=4;save();render()});return}
    else S.menu[k]=v;
    save();render();return;
  }
  if(a==='step'){
    const k=b.dataset.k,d=+b.dataset.d;
    S.staff[k]=clamp(S.staff[k]+d,0,staffMax(k));save();render();return;
  }
  if(a==='buy'){buy(b.dataset.k);return}
  if(a==='open'){closeModal();startDay();return}
  if(a==='rest'){if(S.phase==='closed'||S.phase==='morning'){S.sick=false;restDay()}return}
  if(a==='forceopen'){S.phase='morning';render();return}
  if(a==='speed'){speed=+b.dataset.v;paused=false;render();return}
  if(a==='pause'){paused=!paused;render();return}
  if(a==='close'){D.closedNow=true;log(hm(D.min),'早仕舞いすることにした','info');render();return}
  if(a==='skip'){while(S.phase==='open'&&stepMinute()){}return}
  if(a==='next'){nextDay();return}
  if(a==='ev'){const ev=EVENTS.find(x=>x.id===S.event);const msg=ev.choices[+b.dataset.i].f();S.event=null;closeModal();log('朝',msg,'info');save();render();return}
  if(a==='closemodal'){closeModal();render();return}
  if(a==='trday'){S.train.day=b.dataset.k;save();render();return}
  if(a==='trnight'){S.train.night=b.dataset.k;save();render();return}
  if(a==='trgo'){trainWeeks(+b.dataset.n||1);save();render();return}
  if(a==='trstay'){const t=S.train;t.crisis=null;t.survived=true;t.motiv=clamp(t.motiv+15,0,100);t.fat=Math.max(0,t.fat-10);t.last={title:'踏みとどまった',msgs:['もう少しだけ、続けてみることにした。']};save();render();return}
  if(a==='trv'){const t=S.train,e=TRAIN_STORY.find(x=>x.id===t.pending);if(!e)return;const msg=e.choices[+b.dataset.i].f(t);t.pending=null;t.motiv=clamp(t.motiv,0,100);t.trust=clamp(t.trust,0,100);t.skill=clamp(t.skill,0,10);t.last={title:e.title,msgs:[msg]};save();render();return}
  if(a==='trquit'){quitTraining();save();render();return}
  if(a==='trend'){const t=S.train,cands=talentCands(t),slots=Math.min(talentSlots(t),cands.length);finishTraining();queueModal(trainDoneHTML());if(slots>0){talentPick={cands,slots,chosen:[]};queueModal(talentPickHTML())}queueModal(tutorialHTML());save();render();return}
  if(a==='talent'&&talentPick){const id=b.dataset.k;if(!talentPick.chosen.includes(id)){talentPick.chosen.push(id);S.talents=(S.talents||[]).concat(id);log('—',`才能「${TALENTS.find(x=>x.id===id).name}」を身につけた`,'good')}if(talentPick.chosen.length>=talentPick.slots){talentPick=null;closeModal()}else openModal(talentPickHTML());save();render();return}
  if(a==='guide'){S.guide=!S.guide;save();render();return}
  if(a==='useprep'){S.prep=+b.dataset.v;log('朝',`仕込みを親方の目安の${S.prep}杯にした`,'info');save();render();return}
  if(a==='devstart'){const id=b.dataset.k;adGate('menuDev',()=>{devStart(id);save();render()});return}
  if(a==='devon'){devOn(b.dataset.k);save();render();return}
  if(a==='devoff'){devOff(b.dataset.k);save();render();return}
  if(a==='modalcancel'){BF=null;RL=null;closeModal();render();return}
  if(a==='bfopen'){BF=null;openModal(branchModal());return}
  if(a==='bf'){const k=b.dataset.k;BF[k]=k==='loc'?b.dataset.v:+b.dataset.v;openModal(branchModal());return}
  if(a==='bfgo'){closeModal();adGate('branch',()=>{doBranch();checkStages();save();render()});return}
  if(a==='rlopen'){RL=null;openModal(relocModal());return}

    setup.name=($('#shopname').value||'').trim()||'麺屋 灯';
    if(setup.train==='avg')adGate('skipTraining',beginGame);else beginGame();
    return;
  }
  if(a==='adshow'){if(AD.show)AD.show();return}
  if(a==='adcancel'){AD.pending=null;closeModal();return}
  if(a==='adclose'){const go=AD.pending;AD.pending=null;closeModal();if(go)go();save();render();return}
  if(a==='closemonth'){closeModal();adGate('monthEnd',()=>{});render();return}
  if(a==='hireplus'){if((S.extraStaff||0)>=2||S.cash<100000)return;adGate('staffCap',()=>{S.cash-=100000;S.month.ads+=100000;S.extraStaff=(S.extraStaff||0)+1;log('朝','求人を出した。雇える人数が厨房・ホールとも1人増えた','info');save();render()});return}
});
function beginGame(){{
    const nm=setup.name;
    newGame(nm,setup.loc,setup.style,setup.diff);closeModal();D=null;logEl.innerHTML='';
    if(setup.train==='yes'){startTraining();log('—','名店に弟子入りした。修行の始まりだ','info')}
    else{
      if(setup.train==='avg'){S.skill=4;S.mgmt=1.5;S.conn=1.5;S.awareness=Math.min(1,S.awareness+S.conn*.025);S.trainSummary={weeks:156,rank:'一人前',preset:true}}
      else S.novice=true;
      queueModal(tutorialHTML());
      log('—',`「${nm}」開業。${setup.train==='avg'?'修行3年の腕で':'経験ゼロから'}、${LOC[setup.loc].name}の${STYLES[setup.style].name}ラーメンで勝負する`,'info');
    }
    tab='prep';save();render();
}}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
});
document.addEventListener('input',e=>{
  const t=e.target;if(!S)return;
  if(t.id==='prep'){S.prep=+t.value;const o=t.parentElement.querySelector('.price-big');if(o)o.textContent=S.prep+'杯';save()}
  if(t.id==='price'){S.menu.price=+t.value;save();
    // 再描画するとスライダーのドラッグが切れるので数値部分だけ更新
    const st=STYLES[S.style],bc=bowlCost(),ratio=bc.total/S.menu.price*100;
    const pb=t.parentElement.querySelector('.price-big');if(pb)pb.textContent=S.menu.price.toLocaleString()+'円';
    const cb=document.querySelectorAll('.costbox .v');if(cb.length>=3){cb[1].textContent=ratio.toFixed(1)+'%';cb[2].textContent=yen(S.menu.price-bc.total)}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;if(!S)return;
  if(t.dataset.act==='side'){S.menu[t.dataset.k]=t.checked;save();render()}
  if(t.dataset.act==='bfloan'&&BF){BF.loan=t.checked;openModal(branchModal())}
  if(t.dataset.act==='rlloan'&&RL){RL.loan=t.checked;openModal(relocModal())}
  if(t.id==='price'){render()}
});
function buy(k){
  const pay=(n,lab)=>{S.cash-=n;S.month.invest+=n;log('朝',`${lab}（${yen(n)}）`,'info')};
  if(k==='dinner'){S.cash-=50000;S.month.ads+=50000;const g=.3*(1-(S.conn||0)/10)*(hasT('hitotarashi')?1.5:1);S.conn=Math.min(10,(S.conn||0)+g);log('朝',`業者や組合の人と会食した。人脈+${g.toFixed(2)}`,'info')}
  if(k==='event'){S.cash-=200000;S.month.ads+=200000;const g=.6*(1-(S.conn||0)/10)*(hasT('hitotarashi')?1.5:1);S.conn=Math.min(10,(S.conn||0)+g);S.awareness=Math.min(1.25,S.awareness+.05);log('朝',`ラーメンイベントに出店した。人脈+${g.toFixed(2)}・知名度が上がった`,'good');S.hist.push({d:S.day,sales:0,profit:0,cust:0,rating:rating(),closed:true,lost:0,waste:0});simBranches();S.fatigue=clamp(S.fatigue+15,0,100);nextDay();return}
  if(k==='sns'){S.sns=!S.sns;log('朝',S.sns?'SNS広告を開始した':'SNS広告を止めた','info')}
  if(k==='flyer'){S.cash-=30000;S.month.ads+=30000;const g=.06*(1.25-S.awareness);S.awareness=Math.min(1.25,S.awareness+g);log('朝',`チラシを撒いた。認知度+${(g*100).toFixed(1)}`,'info')}
  if(k==='sign'&&!S.inv.sign){pay(120000,'看板と提灯を新調');S.inv.sign=true;S.awareness=Math.min(1.25,S.awareness+.08)}
  if(k==='pot'&&!S.inv.pot){pay(180000,'寸胴を増設');S.inv.pot=true}
  if(k==='cashless'&&!S.inv.cashless){pay(250000,'券売機をキャッシュレス対応に');S.inv.cashless=true}
  if(k==='machine'&&!S.inv.machine){pay(1200000,'製麺機を導入');S.inv.machine=true;S.menu.noodle=3}
  save();render();
}

// ───────── 保存 ─────────
function save(){
  if(!S)return;
  try{const copy={...S};if(copy.phase==='open'){copy.phase='morning'}localStorage.setItem(SAVE_KEY,JSON.stringify(copy))}catch(_){}
}
function migrate(o){
  if(o.v===1){
    const avg=o.rCnt?o.rSum/o.rCnt:3;
    o.stars=Array(Math.min(o.rCnt||0,150)).fill(avg);o.rTotal=o.rCnt||0;
    o.loans=o.debt>0?[{name:'開業資金',left:o.debt,pay:LOAN_PAY}]:[];
    o.v=2;
  }
  const def={size:0,branches:[],nextBr:1,brToday:[],stage:0,stageDay:{},media:false,streak42:0,bestMonthCust:0,relocated:false,closedUntil:-1,critic:null,criticNext:0,legend:false,loans:[],stars:[],rTotal:0,diff:'real',guide:true,dev:{},menuOn:[],gentei:null,mgmt:0,conn:0,secret:0,noren:false,train:null,novice:false,talents:[],vision:null};
  for(const k in def)if(o[k]===undefined)o[k]=def[k];
  if(!o.bestMonthCust&&o.months&&o.months.length)o.bestMonthCust=Math.max(...o.months.map(m=>m.cust||0));
  for(const k of ['brSales','brCost','brCust'])if(o.month[k]===undefined)o.month[k]=0;
  if(o.phase==='clear')o.phase='morning';
  if(o.luck===undefined)o.luck=gauss();if(o.tide===undefined)o.tide=0;if(o.criticPass===undefined)o.criticPass=o.legend?2:0;if(o.streak43===undefined)o.streak43=0;
  if(!o.menuV){o.menu.grade=[0,2,4][o.menu.grade]??0;o.menu.noodle=[0,2,3][o.menu.noodle]??0;o.menuV=2} // スープ・麺を5段階にした版への引き継ぎ
  if(o.menuV===2){o.menu.chashu=[0,2][o.menu.chashu]??0;o.menuV=3} // チャーシューを5段階にした版への引き継ぎ
  if(o.train&&!o.train.cnt)o.train.cnt={};
  if(o.phase==='train'&&o.train&&o.train.m!==undefined&&o.train.unit!=='w'){o.train.m=Math.round(o.train.m*4.34);o.train.roleM=Math.round((o.train.roleM||0)*4.34);o.train.unit='w'}
  if(o.phase==='train'&&o.train&&o.train.m===undefined){const t=o.train;o.train={unit:'w',m:t.week||0,role:0,roleM:0,skill:t.skill||0,mgmt:t.mgmt||0,conn:t.conn||0,trust:t.trust||50,fat:t.fat||10,motiv:70,save:t.save||0,secret:t.secret||0,day:'obey',night:'rest',last:null,crisis:null,held:false}}
  return o;
}
function load(){try{const s=localStorage.getItem(SAVE_KEY);if(s){const o=JSON.parse(s);if(o&&(o.v===1||o.v===2))return migrate(o)}}catch(_){}return null}
window.claude?.hot?.snapshot?.(()=>({S:S&&S.phase==='open'?{...S,phase:'morning'}:S}));

function boot(data){
  loadAds();
  if(!/claude/.test(location.hostname)&&/^https?:/.test(location.protocol)){const f=document.createElement('footer');f.className='site-foot';f.innerHTML='<a href="privacy.html">プライバシーポリシー</a>';document.querySelector('.app').appendChild(f)}
  S=(data&&data.S)?migrate(data.S):load();
  if(S&&S.phase==='open'){S.phase='morning'}
  render();
  if(!S){showSetup()}
  else log('—',`${fmtDate(S.day)} から再開`,'info');
  requestAnimationFrame(loop);
}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
})();
</script>
