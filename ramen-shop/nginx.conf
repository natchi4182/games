# 1つの nginx で3つのアドレスを受け持つ
#   ramen.air-io.com      … ゲーム本体（下の default_server。IP 直打ちなどもここ）
#   air-io.com            … AirIo Creative の入口ページ
#   ramen-kaigyo.fly.dev  … 旧アドレス。セーブを引き継いで ramen.air-io.com へ移す

# ゲーム本体
server {
  listen 8080 default_server;
  server_name ramen.air-io.com;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/conf.d/common.inc;

  # ゲーム本体は更新を早く反映させるためキャッシュしない
  location = / { add_header Cache-Control "no-cache"; include /etc/nginx/conf.d/headers.inc; try_files /index.html =404; }
  location = /index.html { add_header Cache-Control "no-cache"; include /etc/nginx/conf.d/headers.inc; try_files $uri =404; }
  location ~ ^/(portal|move)\.html$ { return 404; }
  # BGM は変わらないので1週間キャッシュする（差し替えるときはファイル名を変える）
  location /bgm/ { add_header Cache-Control "public, max-age=604800"; include /etc/nginx/conf.d/headers.inc; try_files $uri =404; }
  location / { try_files $uri $uri/ =404; }
}

# 入口ページ
server {
  listen 8080;
  server_name air-io.com www.air-io.com;
  root /usr/share/nginx/html;
  include /etc/nginx/conf.d/common.inc;

  if ($host = www.air-io.com) { return 301 https://air-io.com$request_uri; }
  location = / { add_header Cache-Control "no-cache"; include /etc/nginx/conf.d/headers.inc; try_files /portal.html =404; }
  location ~ ^/(privacy|terms)\.html$ { try_files $uri =404; }
  location ~ ^/(legal\.css|icon[^/]*|portal-icon[^/]*|mawaru-512\.png)$ { try_files $uri =404; }
  location = /portal.webmanifest { default_type application/manifest+json; try_files $uri =404; }
  # それ以外（旧来の /index.html など）はゲームへ
  location / { return 301 https://ramen.air-io.com$request_uri; }
}

# 旧アドレス：どのページを開いても、セーブを引き継ぐページを返す
server {
  listen 8080;
  server_name ramen-kaigyo.fly.dev;
  root /usr/share/nginx/html;
  include /etc/nginx/conf.d/common.inc;

  location ~ ^/(legal\.css|icon[^/]*)$ { try_files $uri =404; }
  location / { add_header Cache-Control "no-store"; include /etc/nginx/conf.d/headers.inc; try_files /move.html =404; }
}
